                      "Minecarts can travel along rails and powered rails can accelerate them. "
                      "Redstone allows players to control rail junctions, stations and automatic systems. "
                      "Large survival worlds can therefore contain railway networks connecting distant "
                      "bases, farms and villages."
                  ),
              },

              {
                  "topic": "Observers",
                  "theme": "observer",
                  "title": "Observers Can See Block Changes",
                  "hook": "This tiny redstone component acts almost like a Minecraft sensor.",
                  "fact": (
                      "Observers detect changes in the block state directly in front of them and produce "
                      "a short redstone pulse. This makes them extremely useful for detecting growing crops, "
                      "moving pistons, changing blocks and other events. Observers are one of the main "
                      "building blocks behind compact automatic farms."
                  ),
              },

              {
                  "topic": "Droppers",
                  "theme": "dropper",
                  "title": "Droppers Can Build Item Machines",
                  "hook": "A dropper looks simple, but it can become part of a complicated machine.",
                  "fact": (
                      "Droppers can move items when powered by redstone. Unlike dispensers, they generally "
                      "do not use the item themselves; they simply output it. By combining droppers with "
                      "hoppers, comparators and redstone clocks, players can create sorting, dispensing "
                      "and automated transportation systems."
                  ),
              },

              {
                  "topic": "Comparators",
                  "theme": "comparator",
                  "title": "Comparators Can Read Containers",
                  "hook": "Redstone comparators can actually measure information stored inside blocks.",
                  "fact": (
                      "A redstone comparator can produce a signal based on the fullness of certain "
                      "containers and other block states. This lets players detect when chests are full, "
                      "measure brewing progress, build item sorters and create systems that react to "
                      "information rather than simply turning on and off."
                  ),
              },

              {
                  "topic": "Minecraft Seeds",
                  "theme": "seed",
                  "title": "One Number Can Create A Whole World",
                  "hook": "Minecraft can turn a seed into an entire world of terrain.",
                  "fact": (
                      "A Minecraft world seed is used by the game's generation system to determine how "
                      "many parts of the world are created. Using the same seed with the same generation "
                      "rules can reproduce the same general world layout, which is why seed hunting is "
                      "so important when players search for unusual terrain or structures."
                  ),
              },

              {
                  "topic": "Biomes",
                  "theme": "biome",
                  "title": "Minecraft Has Many Different Biomes",
                  "hook": "The terrain around you can completely change depending on the biome.",
                  "fact": (
                      "Minecraft biomes control many environmental features including vegetation, weather, "
                      "terrain appearance and which mobs can spawn. A journey can therefore move from "
                      "forests and plains into deserts, snowy regions, oceans or other environments, "
                      "all generated from the world's underlying terrain rules."
                  ),
              },

              {
                  "topic": "The Void",
                  "theme": "void",
                  "title": "Minecraft Has A True Void",
                  "hook": "There is a place below the world where Minecraft stops being solid.",
                  "fact": (
                      "The void exists below the playable world and in parts of the End. "
                      "Falling into it causes damage and can eventually kill the player. "
                      "Because there is normally nothing to stand on, the void has become one of "
                      "Minecraft's most dangerous hazards and an important part of End exploration."
                  ),
              },

              {
                  "topic": "Nether Portals",
                  "theme": "portal",
                  "title": "Nether Portals Connect Dimensions",
                  "hook": "A simple obsidian frame can connect two completely different worlds.",
                  "fact": (
                      "Nether Portals transport players between the Overworld and Nether. "
                      "The game uses a coordinate relationship between the dimensions, which means "
                      "building portals at carefully chosen locations can create fast travel routes "
                      "across enormous distances."
                  ),
              },

              {
                  "topic": "Minecraft Inventory",
                  "theme": "inventory",
                  "title": "Minecraft Inventories Have A Strict Limit",
                  "hook": "Even the richest Minecraft player eventually runs out of space.",
                  "fact": (
                      "Players have a limited inventory made from slots that can hold different stacks "
                      "of items. Stack sizes vary depending on the item. Shulker Boxes dramatically "
                      "increase portable storage because they preserve their contents when picked up "
                      "and placed somewhere else."
                  ),
              },

              {
                  "topic": "Shulker Boxes",
                  "theme": "shulker",
                  "title": "Shulker Boxes Changed Storage",
                  "hook": "One box lets you carry an entire collection of items inside your inventory.",
                  "fact": (
                      "Shulker Boxes are portable storage containers whose contents remain inside when "
                      "the box is broken and picked up. This means players can carry many filled boxes "
                      "without emptying them first. They are especially useful for large building projects, "
                      "long mining trips and transporting resources."
                  ),
              },

              {
                  "topic": "Totem",
                  "theme": "totem",
                  "title": "The Totem Of Undying",
                  "hook": "One item can save a player from an otherwise fatal situation.",
                  "fact": (
                      "The Totem of Undying activates when held in a player's hand at the moment they "
                      "would otherwise die. Instead of dying normally, the player is saved and receives "
                      "several temporary effects. Totems are rare and are strongly associated with "
                      "dangerous raids and high-risk exploration."
                  ),
              },

              {
                  "topic": "Raids",
                  "theme": "raid",
                  "title": "Minecraft Raids Can Get Huge",
                  "hook": "Villages can suddenly become battlefields.",
                  "fact": (
                      "Raids can occur when players with the appropriate status enter a village. "
                      "Groups of hostile raiders then attack, including different specialised enemies. "
                      "Successfully defending the village can provide rewards and changes to the player's "
                      "interaction with villagers."
                  ),
              },

              {
                  "topic": "Pillagers",
                  "theme": "pillager",
                  "title": "Pillagers Have Their Own Weapons",
                  "hook": "Not every Minecraft enemy needs to get close to attack you.",
                  "fact": (
                      "Pillagers use crossbows and can attack players and villagers from a distance. "
                      "They are part of the illager group and can appear in patrols, outposts and raids. "
                      "Their ranged attacks make open areas much more dangerous than they might initially seem."
                  ),
              },

              {
                  "topic": "Wood",
                  "theme": "forest",
                  "title": "Wood Is One Of Minecraft's Most Important Resources",
                  "hook": "Almost every Minecraft adventure starts with the same basic material.",
                  "fact": (
                      "Wood can be converted into planks and used to create an enormous number of "
                      "early-game items including tools, crafting tables, sticks, chests and building blocks. "
                      "Different tree types provide different wood sets, allowing players to build with "
                      "many different colours and textures."
                  ),
              },

              {
                  "topic": "Crafting",
                  "theme": "crafting",
                  "title": "The Crafting Table Unlocks Minecraft",
                  "hook": "One four-block grid becomes a nine-slot workshop.",
                  "fact": (
                      "The crafting table expands the player's crafting grid from the small personal grid "
                      "to a three-by-three grid. That extra space is enough to create tools, weapons, "
                      "armour, blocks, machines and many of the game's most important items."
                  ),
              },

              {
                  "topic": "Diamonds",
                  "theme": "diamond",
                  "title": "Why Diamonds Became Minecraft's Iconic Ore",
                  "hook": "For years, finding this blue ore meant you had hit the jackpot.",
                  "fact": (
                      "Diamond is used to create some of Minecraft's strongest conventional tools, weapons "
                      "and armour. It is also required for several important crafting recipes. "
                      "Although Netherite equipment is stronger, diamond remains an important progression "
                      "material because Netherite upgrades require diamond equipment."
                  ),
              },

              {
                  "topic": "Emeralds",
                  "theme": "emerald",
                  "title": "Emeralds Work Differently From Most Ores",
                  "hook": "Minecraft's green ore isn't mainly valuable because of its tools.",
                  "fact": (
                      "Emeralds are primarily used as the currency for villager trading. "
                      "Emerald ore is relatively uncommon, but players can obtain large quantities of "
                      "emeralds through trading systems. This makes villagers one of the most important "
                      "ways to turn renewable resources into valuable currency."
                  ),
              },

              {
                  "topic": "Gold",
                  "theme": "gold",
                  "title": "Gold Has Some Very Specific Uses",
                  "hook": "Minecraft gold isn't simply a weaker version of diamond.",
                  "fact": (
                      "Gold has several unique uses including powered rails, golden apples, clocks and "
                      "Nether-related crafting. Wearing at least one piece of gold armour also prevents "
                      "ordinary Piglins from becoming automatically hostile in many situations, making "
                      "gold particularly useful when exploring the Nether."
                  ),
              },

              {
                  "topic": "Lapis",
                  "theme": "lapis",
                  "title": "Lapis Lazuli Is Important For Enchanting",
                  "hook": "That blue ore has a job far more important than decoration.",
                  "fact": (
                      "Lapis Lazuli is required when using an enchanting table to apply enchantments. "
                      "It can also be used as a blue dye. This gives the ore two very different purposes: "
                      "one for progression and one for building and decoration."
                  ),
              },

              {
                  "topic": "Coal",
                  "theme": "coal",
                  "title": "Coal Powers The Early Game",
                  "hook": "Before automatic farms and giant machines, players rely on one simple fuel.",
                  "fact": (
                      "Coal is one of the most accessible early-game fuels and can be used to smelt "
                      "items in furnaces. It can also be crafted into torches, which are essential for "
                      "lighting caves and preventing many hostile mobs from spawning in dark areas."
                  ),
              },

              {
                  "topic": "Quartz",
                  "theme": "quartz",
                  "title": "Nether Quartz Is A Redstone Resource",
                  "hook": "One Nether ore quietly powers some of Minecraft's most advanced machines.",
