          # ------------------------------------------------------------
          # Captions
          # ------------------------------------------------------------

          def make_caption_file():
              ass = OUT / "captions.ass"

              # Split narration into timed chunks.
              words = full_text.split()

              # Approximate timing based on word count.
              #
              # This gives the captions movement instead of one giant
              # static paragraph.
              #

              total = max(1, len(words))

              lines = []

              for i in range(0, total, 5):
                  chunk = words[i:i + 5]

                  start = 0.35 + (i / total) * 18.0
                  end = 0.35 + ((i + len(chunk)) / total) * 18.0

                  text = " ".join(chunk)

                  text = (
                      text
                      .replace("{", "")
                      .replace("}", "")
                      .replace("&", "and")
                  )

                  start_s = f"{int(start // 3600)}:{int((start % 3600)//60):02d}:{start%60:05.2f}"
                  end_s = f"{int(end // 3600)}:{int((end % 3600)//60):02d}:{end%60:05.2f}"

                  lines.append(
                      "Dialogue: 0,"
                      f"{start_s},"
                      f"{end_s},"
                      "Caption,,0,0,0,,"
                      f"{{\\fad(100,80)\\t(0,120,\\fscx110\\fscy110)}}"
                      f"{text}"
                  )

              content = f"""[Script Info]
          ScriptType: v4.00+
          PlayResX: 720
          PlayResY: 1280

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Caption,DejaVu Sans,42,&H00FFFFFF,&H00FFFFFF,&H00101010,&H90000000,1,0,0,0,100,100,0,0,1,4,2,2,45,45,210,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          {chr(10).join(lines)}
          """

              ass.write_text(content, encoding="utf-8")

              return ass

          # ------------------------------------------------------------
          # Overlay graphics and captions
          # ------------------------------------------------------------

          def add_graphics(video, output):
              ass = make_caption_file()

              # Top hook banner.
              #
              # The footage remains visible behind it.
              #

              draw_filter = (
                  "drawbox="
                  "x=28:y=52:"
                  "w=664:h=84:"
                  "color=black@0.48:"
                  "t=fill,"
                  "drawtext="
                  "fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:"
                  "text='BLOCK FUEL':"
                  "fontsize=34:"
                  "fontcolor=white:"
                  "x=(w-text_w)/2:"
                  "y=73:"
                  "enable='between(t,0,2.8)',"
                  "drawbox="
                  "x=0:y=0:w=iw:h=iw*0:"
                  "color=black@0:t=fill"
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(video),
                  "-vf",
                  draw_filter + ",ass=" + str(ass),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "19",
                  "-pix_fmt",
                  "yuv420p",
                  "-r",
                  "30",
                  str(output)
              ]

              subprocess.run(cmd, check=True)

          # ------------------------------------------------------------
          # Mix voice + music + effects
          # ------------------------------------------------------------

          def final_audio(video, voice, music, sfx, output):
              cmd = [
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(video),
                  "-i",
                  str(voice),
                  "-i",
                  str(music),
                  "-i",
                  str(sfx),
                  "-filter_complex",
                  (
                      "[1:a]loudnorm=I=-16:TP=-1.5:LRA=11,"
                      "acompressor=threshold=-18dB:ratio=3:attack=5:release=80,"
                      "volume=1.15[voice];"
                      "[2:a]volume=0.22[music];"
                      "[3:a]adelay=2500|2500,"
                      "volume=0.32[sfx];"
                      "[music][voice][sfx]"
                      "amix=inputs=3:duration=longest:dropout_transition=2,"
                      "loudnorm=I=-14:TP=-1.5:LRA=11[a]"
                  ),
                  "-map",
                  "0:v",
                  "-map",
                  "[a]",
                  "-shortest",
                  "-c:v",
                  "copy",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-movflags",
                  "+faststart",
                  str(output)
              ]

              subprocess.run(cmd, check=True)

          # ------------------------------------------------------------
          # Main render
          # ------------------------------------------------------------

          def main():
              print("=" * 60)
              print("BLOCK FUEL")
              print("=" * 60)
              print("Fact:")
              print(narration)
              print()
              print("Pexels search:")
              print(fact["search"])
              print()
              print("Narration:")
              print(full_text)
              print("=" * 60)

              # Remove old clips.
              for p in CLIPS.glob("*"):
                  p.unlink()

              # Download real web footage.
              clips = collect_clips()

              # --------------------------------------------------------
              # If web footage exists, build a multi-shot video.
              # --------------------------------------------------------

              raw_video = OUT / "raw_video.mp4"

              if clips:
                  print(f"Using {len(clips)} real web clips.")

                  segments = []

                  # 4.5 seconds per shot.
                  for i in range(4):
                      source = clips[i % len(clips)]
                      segment = OUT / f"segment_{i}.mp4"

                      process_segment(
                          source,
                          segment,
                          start=random.uniform(0, 2),
                          duration=4.5,
                          style=i
                      )

                      segments.append(segment)

                  combine_segments(
                      segments,
                      raw_video
                  )

              else:
                  make_fallback_video(raw_video)

              # --------------------------------------------------------
              # Voice
              # --------------------------------------------------------

              voice = make_voice()

              # --------------------------------------------------------
              # Music + SFX
              # --------------------------------------------------------

              music = make_music()
              sfx = make_sfx()

              # --------------------------------------------------------
              # Captions and graphics
              # --------------------------------------------------------

              graphic_video = OUT / "graphic_video.mp4"

              add_graphics(
                  raw_video,
                  graphic_video
              )

              # --------------------------------------------------------
              # Final audio
              # --------------------------------------------------------

              final_video = OUT / "block_fuel_short.mp4"

              final_audio(
                  graphic_video,
                  voice,
                  music,
                  sfx,
                  final_video
              )

              # --------------------------------------------------------
              # Metadata
              # --------------------------------------------------------

              title_templates = [
                  "You probably didn't know this Minecraft fact",
                  "This Minecraft mechanic is actually crazy",
                  "Minecraft fact you might have missed",
                  "Most Minecraft players don't know this",
                  "This is how Minecraft actually works",
                  "Minecraft has a mechanic like THIS?"
              ]

              title = random.choice(title_templates)

              description = (
                  f"{narration}\n\n"
                  "Minecraft facts, mechanics and secrets.\n"
                  "New Shorts from Block Fuel.\n\n"
                  "Footage: Pexels\n"
                  "https://www.pexels.com/\n\n"
                  "#Minecraft #MinecraftFacts #Gaming #Shorts"
              )

              (OUT / "title.txt").write_text(
                  title,
                  encoding="utf-8"
              )

              (OUT / "description.txt").write_text(
                  description,
                  encoding="utf-8"
              )

              (OUT / "fact.json").write_text(
                  json.dumps(
                      {
                          "fact": narration,
                          "search": fact["search"],
                          "visual": fact["visual"],
                          "voice": "en_GB-alan-medium",
                          "web_footage": bool(clips),
                          "source": "Pexels"
                      },
                      indent=2
                  ),
                  encoding="utf-8"
              )

              print()
              print("=" * 60)
              print("DONE")
              print("=" * 60)
              print(final_video)
              print("Real web footage:", bool(clips))

              if not PEXELS_KEY:
                  print()
                  print("WARNING:")
                  print("PEXELS_API_KEY was not supplied.")
                  print("The video used the animated fallback instead.")

              print("=" * 60)

          if __name__ == "__main__":
              main()
          PY

      - name: Generate Short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python generator/main.py

      - name: Check output
        run: |
          ls -lah output
          ffprobe -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output/block_fuel_short.mp4

      - name: Upload generated Short
        uses: actions/upload-artifact@v4
        with:
          name: block-fuel-short-${{ github.run_number }}
          path: |
            output/block_fuel_short.mp4
            output/title.txt
            output/description.txt
            output/fact.json
          retention-days: 7
