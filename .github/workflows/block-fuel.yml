              )


          # ============================================================
          # THEME DISPATCH
          # ============================================================

          def render_frame(theme, t, rng):
              img = Image.new(
                  "RGB",
                  (WIDTH, HEIGHT),
                  (20, 20, 20)
              )

              draw = ImageDraw.Draw(img)

              functions = {
                  "creeper": scene_creeper,
                  "redstone": scene_redstone,
                  "dragon": scene_dragon,
                  "piston": scene_piston,
                  "village": scene_village,
                  "ocean": scene_ocean,
                  "nether": scene_nether,
                  "deep_dark": scene_deep_dark,
                  "elytra": scene_elytra,
                  "slime": scene_slime,
                  "copper": scene_copper,
                  "beacon": scene_beacon,
                  "tnt": scene_tnt,
                  "wither": scene_wither,
                  "forest": scene_forest
              }

              fn = functions.get(
                  theme,
                  scene_generic
              )

              fn(
                  draw,
                  t,
                  rng
              )

              # Pixel enhancement
              img = add_pixel_noise(
                  img,
                  rng,
                  0.025
              )

              img = add_vignette(img)

              img = add_scanlines(img)

              return img


          # ============================================================
          # AUDIO
          # ============================================================

          def download_voice():
              voices = TEMP / "voices"
              voices.mkdir(exist_ok=True)

              voice_file = (
                  voices /
                  f"{VOICE}.onnx"
              )

              if voice_file.exists():
                  return

              run([
                  "python",
                  "-m",
                  "piper.download_voices",
                  VOICE,
                  "--data-dir",
                  str(voices)
              ])


          def generate_voice(text, output):
              run([
                  "python",
                  "-m",
                  "piper",
                  "-m",
                  VOICE,
                  "--data-dir",
                  str(TEMP / "voices"),
                  "-f",
                  str(output),
                  "--",
                  text
              ])


          def audio_duration(path):
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  capture_output=True,
                  text=True,
                  check=True
              )

              return float(result.stdout.strip())


          def normalize_audio(src, dst):
              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(src),
                  "-ac",
                  "1",
                  "-ar",
                  "22050",
                  "-sample_fmt",
                  "s16",
                  str(dst)
              ])


          def combine_audio(files, output):
              normalized = []

              for i, src in enumerate(files):
                  dst = TEMP / f"normal_{i}.wav"

                  normalize_audio(
                      src,
                      dst
                  )

                  normalized.append(dst)

              with wave.open(
                  str(normalized[0]),
                  "rb"
              ) as first:

                  params = first.getparams()

                  frames = []

                  for path in normalized:
                      with wave.open(
                          str(path),
                          "rb"
                      ) as w:

                          if (
                              w.getnchannels()
                              != params.nchannels
                              or
                              w.getsampwidth()
                              != params.sampwidth
                              or
                              w.getframerate()
                              != params.framerate
                          ):
                              raise RuntimeError(
                                  "Audio files have incompatible WAV settings."
                              )

                          frames.append(
                              w.readframes(
                                  w.getnframes()
                              )
                          )

              with wave.open(
                  str(output),
                  "wb"
              ) as out:

                  out.setparams(params)

                  for data in frames:
                      out.writeframes(data)


          # ============================================================
          # MUSIC
          # ============================================================

          def generate_music(output, duration):
              sample_rate = 44100

              total = int(
                  sample_rate * duration
              )

              rng = np.random.default_rng()

              audio = np.zeros(
                  total,
                  dtype=np.float32
              )

              notes = [
                  110.0,
                  146.83,
                  164.81,
                  220.0,
                  246.94,
                  293.66
              ]

              for note_index, freq in enumerate(notes):
                  start = int(
                      note_index
                      * total
                      / len(notes)
                  )

                  end = int(
                      (note_index + 1)
                      * total
                      / len(notes)
                  )

                  length = end - start

                  tt = np.arange(
                      length
                  ) / sample_rate

                  wave_data = (
                      np.sin(
                          2 * np.pi * freq * tt
                      ) * 0.10
                  )

                  wave_data += (
                      np.sin(
                          2 * np.pi * freq * 2 * tt
                      ) * 0.025
                  )

                  fade = np.linspace(
                      0,
                      1,
                      min(1000, length)
                  )

                  wave_data[:len(fade)] *= fade
                  wave_data[-len(fade):] *= fade[::-1]

                  audio[start:end] += wave_data

              # Soft atmosphere
              noise = (
                  rng.normal(
                      0,
                      0.005,
                      total
                  )
              )

              audio += noise

              # Fade whole track
              fade_len = min(
                  sample_rate * 2,
                  total // 4
              )

              audio[:fade_len] *= np.linspace(
                  0,
                  1,
                  fade_len
              )

              audio[-fade_len:] *= np.linspace(
                  1,
                  0,
                  fade_len
              )

              audio = np.clip(
                  audio,
                  -1,
                  1
              )

              pcm = (
                  audio * 32767
              ).astype(
                  np.int16
              )

              with wave.open(
                  str(output),
                  "wb"
              ) as w:

                  w.setnchannels(1)
                  w.setsampwidth(2)
                  w.setframerate(sample_rate)
                  w.writeframes(
                      pcm.tobytes()
                  )


          # ============================================================
          # SCRIPT
          # ============================================================

          def choose_fact():
              return random.choice(FACTS)


          def build_narration(fact):
              return [
                  fact["hook"],
                  fact["fact"],
                  "Follow for more Minecraft facts."
              ]


          # ============================================================
          # SUBTITLES
          # ============================================================

          def ass_time(seconds):
              h = int(seconds // 3600)

              m = int(
                  (seconds % 3600) // 60
              )

              s = int(
                  seconds % 60
              )

              cs = int(
                  (seconds - int(seconds)) * 100
              )

              return (
                  f"{h}:{m:02d}:{s:02d}.{cs:02d}"
              )


          def make_ass(sections, output):
              lines = [
                  "[Script Info]",
                  "ScriptType: v4.00+",
                  "PlayResX: 1080",
                  "PlayResY: 1920",
                  "",
                  "[V4+ Styles]",
                  "Format: Name, Fontname, Fontsize, PrimaryColour, "
                  "SecondaryColour, OutlineColour, BackColour, Bold, "
                  "Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, "
                  "Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, "
                  "MarginR, MarginV, Encoding",
                  "Style: Default,DejaVu Sans,58,"
                  "&H00FFFFFF,&H000000FF,&H00000000,&H80000000,"
                  "1,0,0,0,100,100,0,0,1,5,2,2,50,50,250,1",
                  "",
                  "[Events]",
                  "Format: Layer, Start, End, Style, Name, MarginL, "
                  "MarginR, MarginV, Effect, Text"
              ]

              for section in sections:
                  start = section["start"]
                  end = section["end"]
                  text = section["text"]

                  words = text.split()

                  chunks = []

                  current = ""

                  for word in words:
                      test = (
                          word
                          if not current
                          else current + " " + word
                      )

                      if len(test) <= 42:
                          current = test
                      else:
                          if current:
                              chunks.append(current)

                          current = word

                  if current:
                      chunks.append(current)

                  for chunk in chunks:
                      lines.append(
                          "Dialogue: 0,"
                          + ass_time(start)
                          + ","
                          + ass_time(end)
                          + ",Default,,0,0,0,,"
                          + chunk.replace(",", "\\,")
                  )

              output.write_text(
                  "\n".join(lines),
                  encoding="utf-8"
              )


          # ============================================================
          # VIDEO
          # ============================================================

          def render_video(theme, duration, output):
              rng = random.Random(
                  random.randint(
                      0,
                      2_000_000_000
                  )
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "rawvideo",
                  "-pix_fmt",
                  "rgb24",
                  "-s",
                  f"{WIDTH}x{HEIGHT}",
                  "-r",
                  str(FPS),
                  "-i",
                  "-",
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "21",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  str(output)
              ]

              print(
                  "Rendering",
                  round(duration, 2),
                  "seconds..."
              )

              process = subprocess.Popen(
                  cmd,
                  stdin=subprocess.PIPE
              )

              total_frames = int(
                  duration * FPS
              )

              try:
                  for frame_number in range(
                      total_frames
                  ):
                      t = frame_number / FPS

                      frame = render_frame(
                          theme,
                          t,
                          rng
                      )

                      process.stdin.write(
                          frame.tobytes()
                      )

              finally:
                  process.stdin.close()

              code = process.wait()

              if code != 0:
                  raise RuntimeError(
                      f"FFmpeg video rendering failed: {code}"
                  )


          # ============================================================
          # FINAL COMPOSE
          # ============================================================

          def compose_video(
              silent_video,
              voice,
              music,
              subtitles,
              output,
              duration
          ):
              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(silent_video),
                  "-i",
                  str(voice),
                  "-i",
                  str(music),
                  "-filter_complex",
                  (
                      f"[2:a]volume=0.16[music];"
                      f"[1:a]volume=1.0[voice];"
                      f"[voice][music]amix="
                      f"inputs=2:"
                      f"duration=longest:"
                      f"dropout_transition=2[audio];"
                      f"[0:v]subtitles="
                      f"'{subtitles}'"
                      f"[video]"
                  ),
                  "-map",
                  "[video]",
                  "-map",
                  "[audio]",
                  "-t",
                  str(duration),
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "20",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  str(output)
              ])


          # ============================================================
          # MAIN
          # ============================================================

          def main():
              print("=" * 70)
              print("BLOCK FUEL")
              print("Detailed Minecraft Shorts Generator")
              print("=" * 70)

              download_voice()

              fact = choose_fact()

              print()
              print("FACT:")
              print(fact["topic"])
              print(fact["title"])
              print()

              narration = build_narration(
                  fact
              )

              voice_files = []
              sections = []

              current_time = 0.0

              for i, sentence in enumerate(
                  narration
              ):
                  path = TEMP / f"voice_{i}.wav"

                  print(
                      f"Generating voice {i}:",
                      sentence
                  )

                  generate_voice(
                      sentence,
                      path
                  )

                  duration = audio_duration(
                      path
                  )

                  voice_files.append(path)

                  sections.append({
                      "text": sentence,
                      "start": current_time,
                      "end": current_time + duration
                  })

                  current_time += duration

              total_duration = current_time

              print(
                  "Total narration:",
                  round(total_duration, 2),
                  "seconds"
              )

              # Keep the exact original visual timing approach.
              scene_duration = max(
                  4.0,
                  total_duration / 4
              )

              visual_duration = (
                  scene_duration * 4
              )

              voice_full = TEMP / "voice_full.wav"

              combine_audio(
                  voice_files,
                  voice_full
              )

              music = TEMP / "music.wav"

              generate_music(
                  music,
                  visual_duration
              )

              subtitles = TEMP / "captions.ass"

              make_ass(
                  sections,
                  subtitles
              )

              silent_video = TEMP / "silent.mp4"

              render_video(
                  fact["theme"],
                  visual_duration,
                  silent_video
              )

              final_video = (
                  OUTPUT /
                  "block-fuel-short.mp4"
              )

              compose_video(
                  silent_video,
                  voice_full,
                  music,
                  subtitles,
                  final_video,
                  visual_duration
              )

              # Metadata
              title = fact["title"]

              description = (
                  fact["fact"]
                  + "\n\n"
                  + "Minecraft fact from Block Fuel."
                  + "\n"
                  + "Follow for more Minecraft facts."
              )

              (OUTPUT / "title.txt").write_text(
                  title,
                  encoding="utf-8"
              )

              (OUTPUT / "description.txt").write_text(
                  description,
                  encoding="utf-8"
              )

              (OUTPUT / "fact.json").write_text(
                  json.dumps(
                      fact,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              # Validation
              run([
                  "ffprobe",
                  "-v",
                  "error",
                  "-show_entries",
                  "format=duration",
                  "-show_entries",
                  "stream=codec_name,width,height",
                  "-of",
                  "json",
                  str(final_video)
              ])

              print()
              print("=" * 70)
              print("BLOCK FUEL COMPLETE")
              print("=" * 70)
              print()
              print("Video:", final_video)
              print("Title:", title)
              print(
                  "Duration:",
                  round(
                      audio_duration(
                          final_video
                      ),
                      2
                  ),
                  "seconds"
              )


          if __name__ == "__main__":
              main()
          PY

      - name: Generate Block Fuel Short
        run: |
          python generator.py

      - name: Upload finished Short
        uses: actions/upload-artifact@v4
        with:
          name: block-fuel-short-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7
