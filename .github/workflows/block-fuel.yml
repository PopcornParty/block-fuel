name: Block Fuel

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy piper-tts

      - name: Download Piper voice
        run: |
          mkdir -p voices
          python -m piper.download_voices en_US-ryan-high --download-dir voices

      - name: Create generator
        run: |
          cat > generator.py <<'PY'
          import os
          import random
          import math
          import json
          import wave
          import subprocess
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont
          import numpy as np


          ROOT = Path.cwd()
          TEMP = ROOT / "temp"
          OUT = ROOT / "output"
          VOICES = ROOT / "voices"

          TEMP.mkdir(exist_ok=True)
          OUT.mkdir(exist_ok=True)

          WIDTH = 1080
          HEIGHT = 1920
          FPS = 30

          random.seed()


          FACTS = [

              {
                  "topic": "Creepers",
                  "theme": "creeper",
                  "title": "Why Creepers Exist in Minecraft",
                  "hook": "Minecraft's creepers were actually created because something went wrong.",
                  "sentences": [
                      "During development, Notch was trying to create a pig when the model ended up with the wrong proportions.",
                      "The result was a tall, strange creature that became the basis for the creeper.",
                      "Instead of throwing the mistake away, the unusual shape was turned into a hostile mob.",
                      "Creepers later became one of Minecraft's most recognisable enemies because they silently approach players before exploding."
                  ],
                  "closing": "A modelling mistake ended up creating one of Minecraft's most famous mobs."
              },

              {
                  "topic": "Redstone",
                  "theme": "redstone",
                  "title": "Minecraft Redstone Is More Powerful Than It Looks",
                  "hook": "Minecraft's redstone is basically a simple logic system hidden inside a block game.",
                  "sentences": [
                      "Redstone dust can transmit a signal, while components such as repeaters, comparators and pistons can manipulate that signal.",
                      "Because these components can be combined, players can build everything from automatic farms to calculators and working computers.",
                      "A redstone signal normally travels up to fifteen blocks through connected redstone dust before needing a repeater.",
                      "Repeaters can also refresh the signal and introduce a delay, making precise timing possible."
                  ],
                  "closing": "That is why Minecraft can contain machines that look more like engineering projects than game builds."
              },

              {
                  "topic": "Ender Dragon",
                  "theme": "dragon",
                  "title": "The Ender Dragon Has a Hidden Detail",
                  "hook": "The Ender Dragon fight is much more complicated than simply attacking the dragon.",
                  "sentences": [
                      "The dragon can restore its health using the End Crystals positioned around the central island.",
                      "Those crystals create a healing beam that connects to the dragon while it is nearby.",
                      "Destroying the crystals removes those healing sources and makes the fight much more manageable.",
                      "After the dragon is defeated for the first time, an exit portal becomes available and the game shows its end credits."
                  ],
                  "closing": "The crystals are one of the most important parts of the entire End fight."
              },

              {
                  "topic": "Pistons",
                  "theme": "piston",
                  "title": "Why Minecraft Pistons Changed Everything",
                  "hook": "One Minecraft block completely changed what players could build.",
                  "sentences": [
                      "Pistons can push blocks when powered by redstone, allowing players to create moving structures and machines.",
                      "Sticky pistons can also pull certain blocks back when their power is removed.",
                      "This made mechanisms such as hidden doors, automatic farms and flying machines possible.",
                      "There are also limits on how many blocks a piston can move at once, which became an important part of redstone engineering."
                  ],
                  "closing": "Pistons turned Minecraft from a building game into a surprisingly deep engineering sandbox."
              },

              {
                  "topic": "Villagers",
                  "theme": "village",
                  "title": "Minecraft Villagers Have Actual Jobs",
                  "hook": "Minecraft villagers are not just random NPCs — their professions control what they can trade.",
                  "sentences": [
                      "Villagers can take on different professions when they claim certain job-site blocks.",
                      "For example, a librarian uses a lectern while a farmer uses a composter as their job site.",
                      "Their profession determines the types of trades they can offer, and players can interact with those trades to obtain useful items.",
                      "Villager trading became an important part of Minecraft survival because it can provide items that would otherwise take much longer to obtain."
                  ],
                  "closing": "That tiny village can actually become one of the most useful parts of a survival world."
              },

              {
                  "topic": "Ocean Monuments",
                  "theme": "ocean",
                  "title": "Ocean Monuments Are Basically Underwater Fortresses",
                  "hook": "Minecraft's ocean monuments are some of the strangest structures you can find underwater.",
                  "sentences": [
                      "They are large underwater structures made primarily from prismarine and are guarded by hostile guardians.",
                      "Inside the monument are three elder guardians, which are stronger versions of the normal guardian.",
                      "Elder guardians can give nearby players Mining Fatigue, making it much harder to break blocks while exploring.",
                      "Ocean monuments also contain sponge rooms, which can be extremely useful for removing large amounts of water."
                  ],
                  "closing": "So beneath that quiet ocean surface is an entire underwater dungeon."
              },

              {
                  "topic": "Nether",
                  "theme": "nether",
                  "title": "The Nether Is Not Just Another Dimension",
                  "hook": "The Nether has one huge advantage that makes it incredibly useful for travelling.",
                  "sentences": [
                      "Distance travelled in the Nether corresponds to a much greater distance travelled in the Overworld.",
                      "For horizontal movement, travelling one block in the Nether corresponds to eight blocks in the Overworld.",
                      "That means a player can use Nether portals to connect locations that are extremely far apart in the normal world.",
                      "This is why experienced players often build Nether tunnels as fast travel networks between important bases."
                  ],
                  "closing": "The Nether can basically turn a huge Overworld journey into a much shorter trip."
              },

              {
                  "topic": "Ancient Cities",
                  "theme": "deepdark",
                  "title": "Ancient Cities Hide One of Minecraft's Biggest Threats",
                  "hook": "Ancient Cities are designed around one thing: making noise a serious problem.",
                  "sentences": [
                      "They generate deep underground in the Deep Dark and contain large amounts of sculk.",
                      "Sculk sensors can detect vibrations, allowing certain actions to trigger nearby redstone-like responses.",
                      "Repeatedly triggering the wrong sensors can eventually cause a Warden to appear.",
                      "The Warden is extremely powerful, so Ancient Cities encourage players to move carefully instead of simply fighting everything they see."
                  ],
                  "closing": "Sometimes the safest strategy in Minecraft is not fighting the enemy at all."
              },

              {
                  "topic": "Elytra",
                  "theme": "elytra",
                  "title": "The Elytra Completely Changed Minecraft Travel",
                  "hook": "The Elytra is one of the biggest upgrades to movement Minecraft has ever added.",
                  "sentences": [
                      "It allows players to glide through the air instead of simply falling after jumping from a height.",
                      "Firework rockets can be used while gliding to provide extra forward movement.",
                      "This combination lets players travel enormous distances much faster than normal walking or sprinting.",
                      "Elytra are found in End Cities, which means obtaining one requires travelling through the End and finding one of its rare structures."
                  ],
                  "closing": "Once you have an Elytra, travelling across a Minecraft world feels completely different."
              },

              {
                  "topic": "Slimes",
                  "theme": "slime",
                  "title": "Minecraft Slimes Have a Strange Property",
                  "hook": "Minecraft slimes behave differently from most hostile mobs when you defeat them.",
                  "sentences": [
                      "Large slimes split into smaller slimes when defeated, creating multiple new enemies.",
                      "Those smaller slimes can then split again until the slime reaches its smallest size.",
                      "Small slimes cannot damage players in the same way as larger slimes, but they can still move around and get in the way.",
                      "Slime chunks also allow players to build dedicated slime farms underground."
                  ],
                  "closing": "That simple splitting mechanic is what makes slime farming possible."
              },

              {
                  "topic": "Enchanting",
                  "theme": "enchanting",
                  "title": "Minecraft Enchanting Has a Hidden Cost",
                  "hook": "Minecraft's enchanting system is not completely random — your setup affects what you can get.",
                  "sentences": [
                      "An enchanting table can offer different enchantments depending on the player's experience level, the item and the surrounding setup.",
                      "Bookshelves placed around the table can increase the available enchantment level.",
                      "The strongest standard setup uses fifteen bookshelves positioned correctly around the enchanting table.",
                      "Even then, the exact enchantments offered can vary, which is why players sometimes enchant books or cheaper items to change the available options."
                  ],
                  "closing": "So the enchanting table is partly preparation, partly chance, and a little bit of strategy."
              },

              {
                  "topic": "Copper",
                  "theme": "copper",
                  "title": "Copper Does More Than Just Look Good",
                  "hook": "Copper is one of Minecraft's most interesting building materials because it changes over time.",
                  "sentences": [
                      "Copper blocks naturally oxidise when exposed to the environment, gradually changing through several visual stages.",
                      "Players can use honeycomb to wax copper and prevent further oxidation.",
                      "Different oxidation stages provide several colours and textures, making copper useful for detailed builds.",
                      "Lightning rods can also be crafted from copper and can help protect structures from lightning strikes."
                  ],
                  "closing": "Copper is one of those materials that actually becomes part of the story of a build."
              },

              {
                  "topic": "Hoppers",
                  "theme": "redstone",
                  "title": "Hoppers Are Minecraft's Invisible Workers",
                  "hook": "That little funnel-shaped block is doing an incredible amount of work in Minecraft farms.",
                  "sentences": [
                      "Hoppers can collect items from above and move them into containers or other blocks.",
                      "They can also pull items from containers and push them into connected inventories.",
                      "By combining hoppers with chests, furnaces and redstone components, players can build systems that sort and process items automatically.",
                      "Large farms often depend on networks of hoppers quietly moving thousands of items without the player touching them."
                  ],
                  "closing": "You probably notice the farm, but the hoppers are doing most of the boring work underneath it."
              },

              {
                  "topic": "Phantoms",
                  "theme": "phantom",
                  "title": "Why Phantoms Suddenly Attack Players",
                  "hook": "If you spend too long without sleeping, Minecraft can send something after you.",
                  "sentences": [
                      "Phantoms can appear in the Overworld when players have not slept for several in-game days.",
                      "They spawn in the night sky and swoop down towards players.",
                      "This mechanic gives players another reason to maintain a regular sleep cycle during survival gameplay.",
                      "Beds therefore do more than simply change the time of day — they can also prevent these flying mobs from becoming a problem."
                  ],
                  "closing": "Sometimes that bed in your base is more important than it looks."
              },

              {
                  "topic": "Snow Golems",
                  "theme": "snow",
                  "title": "Snow Golems Are Surprisingly Useful",
                  "hook": "Snow Golems look harmless, but they can actually be useful defensive tools.",
                  "sentences": [
                      "Players create a Snow Golem by placing a carved pumpkin on top of two snow blocks.",
                      "Snow Golems can throw snowballs at hostile mobs, although their attacks normally deal no damage.",
                      "Their main value comes from attracting and distracting enemies while also creating snow trails in suitable environments.",
                      "Players can therefore use them for defence, mob distraction and renewable snow production."
                  ],
                  "closing": "Not every Minecraft mob needs to deal damage to be useful."
              },

              {
                  "topic": "Furnaces",
                  "theme": "furnace",
                  "title": "Minecraft Furnaces Are More Important Than They Look",
                  "hook": "The furnace might be one of the simplest blocks in Minecraft, but entire automation systems are built around it.",
                  "sentences": [
                      "A furnace uses fuel to smelt or cook certain items, turning raw materials into useful resources.",
                      "Players can automate furnaces by feeding fuel, input items and finished products through hopper systems.",
                      "A blast furnace specialises in smelting ores and certain metal-related items more quickly than a normal furnace.",
                      "A smoker similarly specialises in cooking food, making different furnace types useful for different jobs."
                  ],
                  "closing": "A simple furnace can become the centre of an entire automated processing system."
              }

          ]


          def run(cmd):
              print("$", " ".join(str(x) for x in cmd))
              result = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout)
              if result.returncode != 0:
                  raise RuntimeError("Command failed")
              return result.stdout


          def ffprobe_duration(path):
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v", "error",
                      "-show_entries", "format=duration",
                      "-of", "default=noprint_wrappers=1:nokey=1",
                      str(path)
                  ],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True
              )
              if result.returncode != 0:
                  raise RuntimeError("Could not read media duration")
              return float(result.stdout.strip())


          def load_font(size):
              candidates = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
              ]

              for path in candidates:
                  if os.path.exists(path):
                      return ImageFont.truetype(path, size)

              return ImageFont.load_default()


          def text_center(draw, text, y, font, fill):
              box = draw.textbbox((0, 0), text, font=font)
              x = (WIDTH - (box[2] - box[0])) / 2
              draw.text((x, y), text, font=font, fill=fill)


          def draw_block(draw, x, y, size, top, side):
              draw.rectangle(
                  [x, y, x + size, y + size],
                  fill=top,
                  outline=side,
                  width=max(2, size // 20)
              )


          def scene_creeper(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (8, 14, 12))
              d = ImageDraw.Draw(img)

              for y in range(0, HEIGHT, 100):
                  shade = int(20 + 25 * (y / HEIGHT))
                  d.rectangle([0, y, WIDTH, y + 100], fill=(5, shade, 10))

              for x in range(0, WIDTH, 90):
                  for y in range(900, HEIGHT, 90):
                      if rng.random() > 0.45:
                          draw_block(d, x, y, 82, (25, 80, 35), (10, 35, 18))

              cx = WIDTH // 2 + int(math.sin(t * 2) * 80)
              cy = 760 + int(math.sin(t * 3) * 25)
              s = 430

              green = (65, 170, 75)
              dark = (8, 45, 20)

              d.rectangle([cx - s//3, cy, cx + s//3, cy + s], fill=green)
              d.rectangle([cx - s//2, cy + s//2, cx + s//2, cy + s//2 + 110], fill=green)

              d.rectangle([cx - 125, cy + 80, cx - 45, cy + 170], fill=dark)
              d.rectangle([cx + 45, cy + 80, cx + 125, cy + 170], fill=dark)
              d.rectangle([cx - 45, cy + 160, cx + 45, cy + 270], fill=dark)
              d.rectangle([cx - 115, cy + 265, cx - 45, cy + 380], fill=dark)
              d.rectangle([cx + 45, cy + 265, cx + 115, cy + 380], fill=dark)

              if int(t * 8) % 2 == 0:
                  d.ellipse([cx - 250, cy - 100, cx + 250, cy + 400], outline=(100, 255, 120), width=8)

              return img


          def scene_redstone(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (12, 12, 18))
              d = ImageDraw.Draw(img)

              for x in range(80, WIDTH - 80, 120):
                  for y in range(700, HEIGHT, 120):
                      draw_block(d, x, y, 105, (65, 65, 70), (25, 25, 30))

              points = []
              for i in range(8):
                  x = 100 + i * 125
                  y = 1050 + int(math.sin(t * 3 + i) * 100)
                  points.append((x, y))

              for a, b in zip(points, points[1:]):
                  d.line([a, b], fill=(230, 25, 30), width=18)

              pulse = (math.sin(t * 8) + 1) / 2
              idx = min(7, int(pulse * 8))

              for i, (x, y) in enumerate(points):
                  r = 30 if i == idx else 18
                  d.ellipse([x-r, y-r, x+r, y+r], fill=(255, 60, 50))

              return img


          def scene_dragon(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (5, 4, 18))
              d = ImageDraw.Draw(img)

              for i in range(80):
                  x = rng.randrange(WIDTH)
                  y = rng.randrange(HEIGHT)
                  r = rng.choice([2, 3, 4])
                  d.ellipse([x-r, y-r, x+r, y+r], fill=(100, 90, 170))

              cx = WIDTH // 2
              cy = 820 + int(math.sin(t * 1.5) * 80)

              wing = 330 + int(math.sin(t * 4) * 50)

              d.polygon(
                  [
                      (cx, cy),
                      (cx - wing, cy - 180),
                      (cx - 220, cy + 40),
                      (cx - 70, cy + 30)
                  ],
                  fill=(30, 25, 35)
              )

              d.polygon(
                  [
                      (cx, cy),
                      (cx + wing, cy - 180),
                      (cx + 220, cy + 40),
                      (cx + 70, cy + 30)
                  ],
                  fill=(30, 25, 35)
              )

              d.ellipse([cx - 180, cy - 80, cx + 180, cy + 120], fill=(25, 20, 30))

              for side in [-1, 1]:
                  d.line(
                      [
                          (cx + side * 120, cy),
                          (cx + side * 380, cy + int(math.sin(t * 3) * 60))
                      ],
                      fill=(65, 55, 80),
                      width=35
                  )

              return img


          def scene_piston(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (18, 22, 28))
              d = ImageDraw.Draw(img)

              base_y = 1050

              for x in range(100, WIDTH - 100, 130):
                  draw_block(d, x, base_y, 110, (100, 105, 110), (40, 40, 45))

              extension = int((math.sin(t * 3) + 1) * 80)

              x = WIDTH // 2

              draw_block(d, x - 80, base_y - 240, 160, (80, 110, 75), (30, 45, 30))

              d.rectangle(
                  [x - 45, base_y - 240 - extension, x + 45, base_y - 240],
                  fill=(160, 145, 120)
              )

              draw_block(
                  d,
                  x - 90,
                  base_y - 340 - extension,
                  180,
                  (130, 130, 130),
                  (50, 50, 50)
              )

              return img


          def scene_village(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (35, 90, 140))
              d = ImageDraw.Draw(img)

              d.rectangle([0, 1150, WIDTH, HEIGHT], fill=(55, 130, 55))

              for x in [100, 430, 760]:
                  wobble = int(math.sin(t * 2 + x) * 15)

                  d.rectangle(
                      [x, 850 + wobble, x + 230, 1150],
                      fill=(130, 90, 55)
                  )

                  d.polygon(
                      [
                          (x - 25, 850 + wobble),
                          (x + 115, 700 + wobble),
                          (x + 255, 850 + wobble)
                      ],
                      fill=(120, 55, 45)
                  )

              return img


          def scene_ocean(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (5, 55, 90))
              d = ImageDraw.Draw(img)

              for y in range(0, HEIGHT, 80):
                  d.line(
                      [(0, y), (WIDTH, y + int(math.sin(t * 2 + y) * 20))],
                      fill=(10, 90, 130),
                      width=20
                  )

              base = 1150

              for x in range(180, 900, 110):
                  h = 260 + int(math.sin(t * 2 + x) * 30)
                  draw_block(
                      d,
                      x,
                      base - h,
                      100,
                      (70, 160, 155),
                      (30, 90, 90)
                  )

              return img


          def scene_nether(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (60, 8, 8))
              d = ImageDraw.Draw(img)

              for i in range(25):
                  x = rng.randrange(WIDTH)
                  y = rng.randrange(500, HEIGHT)
                  r = rng.randrange(5, 25)
                  d.ellipse(
                      [x-r, y-r, x+r, y+r],
                      fill=(255, rng.randrange(50, 150), 10)
                  )

              for x in range(0, WIDTH, 100):
                  for y in range(700, HEIGHT, 100):
                      if rng.random() > 0.25:
                          draw_block(
                              d, x, y, 90,
                              (95, 25, 20),
                              (45, 10, 10)
                          )

              return img


          def scene_deepdark(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (3, 5, 12))
              d = ImageDraw.Draw(img)

              pulse = (math.sin(t * 4) + 1) / 2

              for i in range(20):
                  x = 40 + i * 55
                  height = 200 + int(rng.random() * 500)
                  d.rectangle(
                      [x, 1250 - height, x + 30, 1250],
                      fill=(15, 60 + int(pulse * 40), 70)
                  )

              cx = WIDTH // 2
              cy = 1000

              d.ellipse(
                  [cx - 150, cy - 250, cx + 150, cy + 250],
                  fill=(12, 16, 24)
              )

              d.ellipse(
                  [cx - 90, cy - 100, cx - 30, cy - 40],
                  fill=(60, 210, 230)
              )

              d.ellipse(
                  [cx + 30, cy - 100, cx + 90, cy - 40],
                  fill=(60, 210, 230)
              )

              return img


          def scene_elytra(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (35, 90, 170))
              d = ImageDraw.Draw(img)

              for i in range(30):
                  x = rng.randrange(WIDTH)
                  y = rng.randrange(HEIGHT)
                  d.ellipse([x, y, x+5, y+5], fill=(220, 240, 255))

              cx = WIDTH // 2
              cy = 850 + int(math.sin(t * 2) * 130)

              wing = 280 + int(math.sin(t * 5) * 40)

              d.polygon(
                  [
                      (cx, cy),
                      (cx-wing, cy+160),
                      (cx-100, cy+100),
                      (cx, cy+50)
                  ],
                  fill=(115, 125, 145)
              )

              d.polygon(
                  [
                      (cx, cy),
                      (cx+wing, cy+160),
                      (cx+100, cy+100),
                      (cx, cy+50)
                  ],
                  fill=(115, 125, 145)
              )

              return img


          def scene_slime(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (25, 55, 35))
              d = ImageDraw.Draw(img)

              bounce = abs(math.sin(t * 3))
              size = int(300 + bounce * 120)

              cx = WIDTH // 2
              cy = 1200 - int(bounce * 180)

              d.rounded_rectangle(
                  [
                      cx - size,
                      cy - size,
                      cx + size,
                      cy + size
                  ],
                  radius=45,
                  fill=(70, 210, 100),
                  outline=(20, 90, 45),
                  width=15
              )

              d.rectangle(
                  [cx - 120, cy - 60, cx - 60, cy],
                  fill=(5, 60, 20)
              )

              d.rectangle(
                  [cx + 60, cy - 60, cx + 120, cy],
                  fill=(5, 60, 20)
              )

              return img


          def scene_generic(t, rng):
              img = Image.new("RGB", (WIDTH, HEIGHT), (20, 25, 35))
              d = ImageDraw.Draw(img)

              for i in range(60):
                  x = rng.randrange(WIDTH)
                  y = rng.randrange(HEIGHT)
                  s = rng.randrange(20, 100)
                  draw_block(
                      d,
                      x,
                      y,
                      s,
                      (
                          rng.randrange(40, 120),
                          rng.randrange(40, 120),
                          rng.randrange(40, 120)
                      ),
                      (20, 20, 20)
                  )

              return img


          SCENES = {
              "creeper": scene_creeper,
              "redstone": scene_redstone,
              "dragon": scene_dragon,
              "piston": scene_piston,
              "village": scene_village,
              "ocean": scene_ocean,
              "nether": scene_nether,
              "deepdark": scene_deepdark,
              "elytra": scene_elytra,
              "slime": scene_slime
          }


          def generate_voice(text, output):
              run([
                  "python",
                  "-m",
                  "piper",
                  "-m",
                  "en_US-ryan-high",
                  "--data-dir",
                  str(VOICES),
                  "-f",
                  str(output),
                  "--",
                  text
              ])


          def normalise_wav(source, destination):
              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(source),
                  "-ac", "1",
                  "-ar", "22050",
                  "-sample_fmt", "s16",
                  str(destination)
              ])


          def combine_wavs(files, output):
              normalised = []

              for i, source in enumerate(files):
                  target = TEMP / f"normalised_{i}.wav"
                  normalise_wav(source, target)
                  normalised.append(target)

              with wave.open(str(normalised[0]), "rb") as first:
                  params = first.getparams()
                  frames = [first.readframes(first.getnframes())]

              with wave.open(str(output), "wb") as result:
                  result.setnchannels(params.nchannels)
                  result.setsampwidth(params.sampwidth)
                  result.setframerate(params.framerate)
                  result.setcomptype(params.comptype, params.compname)

                  for i, path in enumerate(normalised):
                      with wave.open(str(path), "rb") as wav:
                          current = wav.getparams()

                          if (
                              current.nchannels != params.nchannels
                              or current.sampwidth != params.sampwidth
                              or current.framerate != params.framerate
                          ):
                              raise RuntimeError("Normalised WAV parameters do not match")

                          result.writeframes(wav.readframes(wav.getnframes()))


          def wav_duration(path):
              with wave.open(str(path), "rb") as wav:
                  return wav.getnframes() / float(wav.getframerate())


          def create_music(duration, output):
              run([
                  "ffmpeg",
                  "-y",
                  "-f", "lavfi",
                  "-i",
                  f"sine=frequency=55:sample_rate=22050:duration={duration}",
                  "-f", "lavfi",
                  "-i",
                  f"sine=frequency=82:sample_rate=22050:duration={duration}",
                  "-filter_complex",
                  "[0:a]volume=0.035[a];[1:a]volume=0.018[b];[a][b]amix=inputs=2:duration=first",
                  "-ar", "22050",
                  "-ac", "1",
                  "-c:a", "pcm_s16le",
                  str(output)
              ])


          def wrap_text(text, font, max_width):
              words = text.split()
              lines = []
              current = ""

              dummy = Image.new("RGB", (10, 10))
              draw = ImageDraw.Draw(dummy)

              for word in words:
                  test = word if not current else current + " " + word
                  width = draw.textbbox((0, 0), test, font=font)[2]

                  if width <= max_width:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              return lines


          def create_ass(sentences, durations, output):
              ass = []

              ass.append("[Script Info]")
              ass.append("ScriptType: v4.00+")
              ass.append("PlayResX: 1080")
              ass.append("PlayResY: 1920")
              ass.append("")
              ass.append("[V4+ Styles]")
              ass.append(
                  "Format: Name, Fontname, Fontsize, PrimaryColour, "
                  "SecondaryColour, OutlineColour, BackColour, Bold, Italic, "
                  "Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, "
                  "BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding"
              )
              ass.append(
                  "Style: Default,DejaVu Sans,58,&H00FFFFFF,&H00FFFFFF,"
                  "&H00101010,&H80101010,1,0,0,0,100,100,0,0,1,4,2,2,80,80,220,1"
              )
              ass.append("")
              ass.append("[Events]")
              ass.append(
                  "Format: Layer, Start, End, Style, Name, MarginL, MarginR, "
                  "MarginV, Effect, Text"
              )

              current = 0.0

              for text, duration in zip(sentences, durations):
                  start = current
                  end = current + duration

                  def ts(value):
                      h = int(value // 3600)
                      m = int((value % 3600) // 60)
                      s = value % 60
                      return f"{h}:{m:02d}:{s:05.2f}"

                  clean = text.replace("{", "(").replace("}", ")")

                  ass.append(
                      f"Dialogue: 0,{ts(start)},{ts(end)},Default,,0,0,0,,{clean}"
                  )

                  current = end

              output.write_text("\n".join(ass), encoding="utf-8")


          def render_video(theme, duration, output):
              scene_function = SCENES.get(theme, scene_generic)
              rng = random.Random(random.randint(1, 999999999))

              process = subprocess.Popen(
                  [
                      "ffmpeg",
                      "-y",
                      "-f", "rawvideo",
                      "-pix_fmt", "rgb24",
                      "-s", f"{WIDTH}x{HEIGHT}",
                      "-r", str(FPS),
                      "-i", "-",
                      "-an",
                      "-c:v", "libx264",
                      "-preset", "veryfast",
                      "-crf", "24",
                      "-pix_fmt", "yuv420p",
                      str(output)
                  ],
                  stdin=subprocess.PIPE
              )

              total_frames = int(duration * FPS)

              try:
                  for frame_number in range(total_frames):
                      t = frame_number / FPS

                      image = scene_function(t, rng)

                      d = ImageDraw.Draw(image)

                      title_font = load_font(64)
                      topic_font = load_font(38)

                      d.rounded_rectangle(
                          [45, 55, WIDTH - 45, 175],
                          radius=25,
                          fill=(0, 0, 0)
                      )

                      d.text(
                          (75, 82),
                          "BLOCK FUEL",
                          font=title_font,
                          fill=(255, 255, 255)
                      )

                      image = image.convert("RGB")
                      process.stdin.write(image.tobytes())

              finally:
                  process.stdin.close()

              code = process.wait()

              if code != 0:
                  raise RuntimeError("Video rendering failed")


          def compose_video(video, voice, music, ass, output, duration):
              run([
                  "ffmpeg",
                  "-y",
                  "-i", str(video),
                  "-i", str(voice),
                  "-i", str(music),
                  "-vf",
                  f"ass={ass}",
                  "-map", "0:v:0",
                  "-map", "1:a:0",
                  "-c:v", "libx264",
                  "-preset", "medium",
                  "-crf", "23",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac",
                  "-b:a", "128k",
                  "-t", f"{duration:.3f}",
                  "-movflags", "+faststart",
                  str(output)
              ])


          def main():
              fact = random.choice(FACTS)

              print()
              print("=" * 70)
              print("BLOCK FUEL")
              print("Topic:", fact["topic"])
              print("Title:", fact["title"])
              print("=" * 70)

              sentences = [
                  fact["hook"],
                  *fact["sentences"],
                  fact["closing"]
              ]

              audio_files = []
              durations = []

              for i, sentence in enumerate(sentences):
                  path = TEMP / f"voice_{i}.wav"

                  print()
                  print("VOICE", i)
                  print(sentence)

                  generate_voice(sentence, path)

                  duration = wav_duration(path)

                  if duration <= 0:
                      raise RuntimeError("Voice file has zero duration")

                  audio_files.append(path)
                  durations.append(duration)

                  print(f"Duration: {duration:.2f}s")

              voice_full = TEMP / "voice_full.wav"

              print()
              print("Combining WAV files directly...")
              combine_wavs(audio_files, voice_full)

              total_duration = wav_duration(voice_full)

              print(f"Final voice duration: {total_duration:.2f}s")

              if total_duration < 8:
                  raise RuntimeError("Generated video is unexpectedly short")

              music = TEMP / "music.wav"
              create_music(total_duration, music)

              video = TEMP / "visuals.mp4"
              render_video(
                  fact["theme"],
                  total_duration,
                  video
              )

              subtitles = TEMP / "subtitles.ass"
              create_ass(
                  sentences,
                  durations,
                  subtitles
              )

              final = OUT / "block-fuel-short.mp4"

              compose_video(
                  video,
                  voice_full,
                  music,
                  subtitles,
                  final,
                  total_duration
              )

              final_duration = ffprobe_duration(final)

              if final_duration < 5:
                  raise RuntimeError("Final video is too short")

              if final.stat().st_size < 100000:
                  raise RuntimeError("Final video file is suspiciously small")

              metadata = {
                  "title": fact["title"],
                  "topic": fact["topic"],
                  "duration_seconds": round(final_duration, 2),
                  "sentences": sentences,
                  "generator": "Block Fuel offline generator"
              }

              metadata_path = OUT / "metadata.json"
              metadata_path.write_text(
                  json.dumps(metadata, indent=2),
                  encoding="utf-8"
              )

              description = (
                  f"{fact['title']}\\n\\n"
                  f"Real Minecraft facts explained with cinematic visuals.\\n\\n"
                  "#Minecraft #MinecraftFacts #Gaming #Shorts"
              )

              (OUT / "description.txt").write_text(
                  description,
                  encoding="utf-8"
              )

              (OUT / "title.txt").write_text(
                  fact["title"],
                  encoding="utf-8"
              )

              print()
              print("=" * 70)
              print("SUCCESS")
              print("Video:", final)
              print("Duration:", final_duration)
              print("Size:", final.stat().st_size)
              print("=" * 70)


          if __name__ == "__main__":
              main()
          PY

      - name: Generate Short
        run: |
          python generator.py

      - name: Check generated files
        run: |
          echo "Generated files:"
          ls -lh output/

          echo
          echo "Video information:"
          ffprobe -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output/block-fuel-short.mp4

      - name: Upload Short
        uses: actions/upload-artifact@v4
        with:
          name: block-fuel-short-${{ github.run_number }}
          path: output/
          retention-days: 7
