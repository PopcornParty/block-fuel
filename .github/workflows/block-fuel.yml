                      "careful construction. Players can also use fire strategically for lighting, traps "
                      "and clearing vegetation."
                  ),
              },

              {
                  "topic": "Water",
                  "theme": "water",
                  "title": "Water Is A Building Tool",
                  "hook": "Minecraft water isn't just something you swim through.",
                  "fact": (
                      "Water can move entities and items, create farms, push mobs and help players descend "
