          def scene_ocean(draw, t, rng):
              draw_sky(
                  draw,
                  (65, 150, 220),
                  (150, 215, 235)
              )

              # Ocean
              for y in range(850, HEIGHT):
                  depth = (y - 850) / (HEIGHT - 850)

                  colour = (
                      int(35 - depth * 20),
                      int(145 - depth * 70),
                      int(200 - depth * 60)
                  )

                  draw.line(
                      [(0, y), (WIDTH, y)],
                      fill=colour
                  )

              # Monument
              base_x = 300
              base_y = 1250

              for row in range(5):
                  for col in range(5):
                      size = 125

                      draw_block(
                          draw,
                          base_x + col * size,
                          base_y - row * 100,
                          size,
                          rng.choice([
                              (80, 175, 170),
                              (65, 150, 150),
                              (95, 190, 180)
                          ])
                      )

              # Monument top
              draw.rectangle(
                  [470, 730, 750, 1250],
                  fill=(75, 160, 155)
              )

              # Guardian
              gx = 820 + math.sin(t * 2) * 80
              gy = 1050 + math.cos(t * 2) * 100

              draw.ellipse(
                  [
                      gx - 100,
                      gy - 70,
                      gx + 100,
                      gy + 70
                  ],
                  fill=(190, 150, 50)
              )

              # Spikes
              for a in range(0, 360, 45):
                  rad = math.radians(a)

                  x1 = gx + math.cos(rad) * 90
                  y1 = gy + math.sin(rad) * 60

                  x2 = gx + math.cos(rad) * 150
                  y2 = gy + math.sin(rad) * 100

                  draw.line(
                      [(x1, y1), (x2, y2)],
                      fill=(225, 190, 70),
                      width=20
                  )

              # Eye
              draw.ellipse(
                  [gx - 22, gy - 22, gx + 22, gy + 22],
                  fill=(255, 50, 60)
              )

              # Bubbles
              particles(
                  draw,
                  rng,
                  t,
                  (180, 240, 255),
                  80
              )


