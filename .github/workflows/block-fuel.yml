          def cinematic(img, frame, intensity=1):
              img = img.convert("RGBA")

              overlay = Image.new(
                  "RGBA",
                  img.size,
                  (0, 0, 0, 0)
              )

              d = ImageDraw.Draw(overlay)

              # Top/bottom cinematic bars.
              bar = int(55*intensity)

              d.rectangle(
                  (0, 0, WIDTH, bar),
                  fill=(0, 0, 0, 210)
              )

              d.rectangle(
                  (
                      0,
                      HEIGHT-bar,
                      WIDTH,
                      HEIGHT
                  ),
                  fill=(0, 0, 0, 210)
              )

              # Vignette.
              for i in range(10):
                  margin = i*28

                  d.rectangle(
                      (
                          margin,
                          margin,
                          WIDTH-margin,
                          HEIGHT-margin
                      ),
                      outline=(0, 0, 0, 10+i*5),
                      width=22
                  )

              # Lens streak.
              streak_y = int(
                  250 +
                  math.sin(frame*0.025)*500
              )

              d.rectangle(
                  (
                      0,
                      streak_y,
                      WIDTH,
                      streak_y+2
                  ),
                  fill=(255, 255, 255, 18)
              )

              return Image.alpha_composite(
                  img,
                  overlay
              ).convert("RGB")

          def particles(img, frame, style):
              d = ImageDraw.Draw(img)

              for i in range(45):
                  x = (
                      i*151 +
                      frame*(1+(i%4))
