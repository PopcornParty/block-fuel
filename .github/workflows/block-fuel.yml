          ENDINGS = [
              "Follow for more Minecraft facts.",
              "Follow for more facts you probably missed.",
              "Follow for the next Minecraft fact.",
              "More Minecraft facts coming soon.",
              "Follow for more."
          ]

          # ============================================================
          # FONTS
          # ============================================================

          def font(size, bold=False):
              paths = []

              if bold:
                  paths = [
                      "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
                      "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
                  ]
              else:
                  paths = [
                      "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
                  ]

              for p in paths:
                  if os.path.exists(p):
                      return ImageFont.truetype(p, size)

              return ImageFont.load_default()

          FONT_TITLE = font(52, True)
          FONT_FACT = font(38, True)
          FONT_SMALL = font(25, False)

          # ============================================================
          # COLOURS
          # ============================================================

          BIOMES = {
              "overworld": ((70, 155, 235), (210, 235, 255), (65, 135, 60)),
              "nether": ((70, 8, 8), (190, 35, 12), (80, 25, 20)),
              "end": ((10, 5, 28), (65, 20, 75), (65, 65, 72)),
              "ocean": ((5, 70, 140), (20, 165, 190), (15, 75, 80)),
              "cave": ((7, 8, 14), (38, 40, 52), (55, 55, 60)),
              "swamp": ((35, 80, 55), (105, 145, 100), (45, 85, 45)),
              "village": ((90, 170, 235), (220, 240, 255), (90, 120, 55)),
              "snow": ((80, 135, 205), (225, 240, 255), (210, 220, 225)),
              "sky": ((35, 105, 205), (170, 220, 255), (75, 145, 70)),
              "forest": ((55, 125, 210), (180, 220, 240), (45, 110, 50)),
              "beach": ((35, 130, 205), (180, 230, 245), (205, 180, 105)),
              "library": ((25, 45, 80), (100, 75, 105), (90, 60, 35)),
              "blacksmith": ((25, 30, 35), (100, 80, 75), (75, 50, 35)),
              "railway": ((35, 40, 50), (90, 95, 105), (75, 55, 40)),
              "jungle": ((30, 125, 80), (110, 195, 130), (55, 110, 50)),
              "river": ((30, 125, 200), (140, 215, 235), (70, 145, 75)),
              "woodland": ((35, 100, 75), (125, 175, 125), (65, 100, 55)),
              "mushroom": ((95, 55, 120), (180, 105, 145), (95, 70, 70)),
              "desert": ((220, 155, 65), (255, 220, 135), (190, 145, 65)),
              "stronghold": ((25, 25, 35), (65, 60, 75), (75, 75, 80)),
              "cliff": ((65, 145, 220), (210, 235, 255), (90, 85, 75)),
              "storm": ((25, 30, 55), (80, 90, 125), (65, 65, 70)),
              "ancient": ((20, 35, 35), (70, 90, 80), (60, 65, 55)),
              "smithing": ((35, 45, 55), (90, 100, 110), (75, 60, 45)),
              "savanna": ((95, 165, 210), (230, 220, 160), (135, 120, 55)),
          }

          # ============================================================
          # BASIC HELPERS
          # ============================================================

          def clamp(v):
              return max(0, min(255, int(v)))

          def mix(a, b, t):
              return tuple(
                  clamp(a[i] * (1 - t) + b[i] * t)
                  for i in range(3)
              )

          def gradient(img, top, bottom):
              d = ImageDraw.Draw(img)

              for y in range(HEIGHT):
                  t = y / HEIGHT
                  d.line(
                      (0, y, WIDTH, y),
                      fill=mix(top, bottom, t)
                  )

          def block(d, x, y, s, colour, h=1):
              depth = s * 0.35

              top = [
                  (x, y),
                  (x+s, y),
                  (x+s+depth, y-depth),
                  (x+depth, y-depth)
              ]

              left = [
                  (x, y),
                  (x+depth, y-depth),
                  (x+depth, y+s*h),
                  (x, y+s*h+depth)
              ]

              right = [
                  (x+s, y),
                  (x+s+depth, y-depth),
                  (x+s+depth, y+s*h+depth),
                  (x+s, y+s*h)
              ]

              top_c = tuple(clamp(c*1.15) for c in colour)
              left_c = tuple(clamp(c*0.72) for c in colour)
              right_c = tuple(clamp(c*0.9) for c in colour)

              d.polygon(top, fill=top_c)
              d.polygon(left, fill=left_c)
              d.polygon(right, fill=right_c)

          def glow_circle(img, x, y, radius, colour):
              layer = Image.new("RGBA", img.size, (0, 0, 0, 0))
              d = ImageDraw.Draw(layer)

              for i in range(8, 0, -1):
                  r = radius + i * 14
                  alpha = int(10 + (8-i)*5)

                  d.ellipse(
                      (x-r, y-r, x+r, y+r),
                      fill=(
                          colour[0],
                          colour[1],
                          colour[2],
                          alpha
                      )
                  )

              img.alpha_composite(layer)

              d2 = ImageDraw.Draw(img)

              d2.ellipse(
                  (
                      x-radius,
                      y-radius,
                      x+radius,
                      y+radius
                  ),
                  fill=colour + (255,)
              )

          def starfield(d, amount=60):
              for i in range(amount):
                  x = rng.randrange(WIDTH)
                  y = rng.randrange(100, 800)
                  s = rng.choice([1, 1, 2, 2, 3])

                  d.rectangle(
                      (x, y, x+s, y+s),
                      fill=(230, 230, 255)
                  )

          # ============================================================
          # SUBJECTS
          # ============================================================

          def creeper(d, x, y, scale=1):
              w = 90 * scale
              h = 145 * scale

              green = (72, 155, 70)

              d.rectangle(
                  (x-w/2, y-h, x+w/2, y),
                  fill=green
              )

              head = 100 * scale

              d.rectangle(
                  (
                      x-head/2,
                      y-h-65*scale,
                      x+head/2,
                      y-h+35*scale
                  ),
                  fill=(68, 145, 66)
              )

              eye = 11 * scale

              d.rectangle(
                  (
                      x-head*0.27,
                      y-h-40*scale,
                      x-head*0.27+eye,
                      y-h-40*scale+eye
                  ),
                  fill=(10, 10, 10)
              )

              d.rectangle(
                  (
                      x+head*0.16,
                      y-h-40*scale,
                      x+head*0.16+eye,
                      y-h-40*scale+eye
                  ),
                  fill=(10, 10, 10)
              )

              d.polygon(
                  [
                      (x-22*scale, y-h+4*scale),
                      (x, y-h+20*scale),
                      (x+22*scale, y-h+4*scale),
                      (x+22*scale, y-h+22*scale),
                      (x, y-h+9*scale),
                      (x-22*scale, y-h+22*scale)
                  ],
                  fill=(10, 10, 10)
              )

              leg = 27 * scale

              d.rectangle(
                  (x-w*0.42, y-65*scale, x-w*0.42+leg, y),
                  fill=(60, 130, 58)
              )

              d.rectangle(
                  (x+w*0.42-leg, y-65*scale, x+w*0.42, y),
                  fill=(60, 130, 58)
              )

          def dragon(d, x, y, scale=1, flap=0):
              body = [
                  (x-105*scale, y),
                  (x-40*scale, y-38*scale),
                  (x+55*scale, y-20*scale),
                  (x+115*scale, y),
                  (x+45*scale, y+38*scale),
                  (x-65*scale, y+32*scale)
              ]

              d.polygon(body, fill=(30, 20, 40))

              d.polygon(
                  [
                      (x-35*scale, y),
                      (x-220*scale, y-150*scale-flap),
                      (x-100*scale, y+20*scale),
                      (x-55*scale, y+25*scale)
                  ],
                  fill=(65, 35, 85)
              )

              d.polygon(
                  [
                      (x+35*scale, y),
                      (x+220*scale, y-150*scale+flap),
                      (x+100*scale, y+20*scale),
                      (x+55*scale, y+25*scale)
                  ],
                  fill=(65, 35, 85)
              )

              glow_circle(
                  d._image.convert("RGBA")
                  if hasattr(d, "_image")
                  else Image.new("RGBA", (WIDTH, HEIGHT)),
                  int(x),
                  int(y),
                  1,
                  (255, 255, 255)
              )

          def fireball(d, x, y, r=25):
              d.ellipse(
                  (x-r*2, y-r*2, x+r*2, y+r*2),
                  fill=(180, 35, 10)
              )

              d.ellipse(
                  (x-r*1.4, y-r*1.4, x+r*1.4, y+r*1.4),
                  fill=(255, 95, 15)
              )

              d.ellipse(
                  (x-r*0.7, y-r*0.7, x+r*0.7, y+r*0.7),
                  fill=(255, 235, 120)
              )

          def lightning(d, x, y):
              points = [
                  (x, y),
                  (x-25, y+90),
                  (x+15, y+90),
                  (x-35, y+200),
                  (x+40, y+100),
                  (x+5, y+100),
                  (x, y)
              ]

              d.line(
                  points,
                  fill=(210, 235, 255),
                  width=12,
                  joint="curve"
              )

          def tree(d, x, y, scale=1):
              trunk = 45 * scale

              d.rectangle(
                  (
                      x-trunk/2,
                      y-170*scale,
                      x+trunk/2,
                      y
                  ),
                  fill=(100, 65, 35)
              )

              for ox, oy, r in [
                  (-55, -175, 75),
                  (10, -220, 90),
                  (70, -170, 70),
                  (0, -130, 80)
              ]:
                  d.ellipse(
                      (
                          x+ox*scale-r*scale,
                          y+oy*scale-r*scale,
                          x+ox*scale+r*scale,
                          y+oy*scale+r*scale
                      ),
                      fill=(40, 125, 50)
                  )

          def village_house(d, x, y, scale=1):
              w = 230 * scale
              h = 180 * scale

              d.rectangle(
                  (x-w/2, y-h, x+w/2, y),
                  fill=(125, 85, 50)
              )

              d.polygon(
                  [
                      (x-w*0.65, y-h),
                      (x, y-h-120*scale),
                      (x+w*0.65, y-h)
                  ],
                  fill=(85, 45, 35)
              )

              d.rectangle(
                  (
                      x-28*scale,
                      y-85*scale,
                      x+28*scale,
                      y
                  ),
                  fill=(55, 35, 25)
              )

              d.rectangle(
                  (
                      x-w*0.32,
                      y-h*0.65,
                      x-w*0.05,
                      y-h*0.38
                  ),
                  fill=(100, 190, 220)
              )

          def ocean_monument(d, x, y, scale=1):
              for i in range(5):
                  bx = x + (i-2)*65*scale

                  d.rectangle(
                      (
                          bx-30*scale,
                          y-200*scale,
                          bx+30*scale,
                          y
                      ),
                      fill=(45, 125, 125)
                  )

              d.rectangle(
                  (
                      x-170*scale,
                      y-230*scale,
                      x+170*scale,
                      y-190*scale
                  ),
                  fill=(60, 150, 145)
              )

          # ============================================================
          # ENVIRONMENT
          # ============================================================

          def environment(style, frame):
              top, bottom, ground = BIOMES.get(
                  style,
                  BIOMES["overworld"]
              )

              img = Image.new("RGB", (WIDTH, HEIGHT))
              gradient(img, top, bottom)

              d = ImageDraw.Draw(img)

              t = frame / TOTAL_FRAMES

              if style == "nether":
                  for i in range(20):
