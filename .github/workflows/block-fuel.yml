                  f"You Probably Missed This Minecraft Detail",
                  f"Minecraft Has A Secret Most Players Miss",
                  f"This Minecraft Detail Is Actually Crazy",
                  f"One Minecraft Fact You Should Know"
              ]

              title = rng.choice(titles)

              description = (
                  f"{fact}\n\n"
                  "Minecraft facts, mechanics and details.\n"
                  "Follow for more Minecraft facts."
              )

              with open(
                  OUTPUT/"title.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(title)

              with open(
                  OUTPUT/"description.txt",
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(description)

              metadata = {
                  "seed": SEED,
                  "topic": topic,
                  "fact": fact,
                  "hook": HOOK,
                  "ending": ENDING,
                  "scene_1": scene_a,
                  "scene_2": scene_b,
                  "scene_3": scene_c,
                  "title": title,
                  "duration": DURATION,
                  "fps": FPS,
                  "resolution": f"{WIDTH}x{HEIGHT}",
                  "shots": 6
              }

              with open(
                  OUTPUT/"fact.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      metadata,
                      f,
                      indent=2
                  )

              # Remove temporary render files.
              frames = OUTPUT/"frames"

              if frames.exists():
                  shutil.rmtree(frames)

              if raw.exists():
                  raw.unlink()

              print("")
              print("====================================")
              print("BLOCK FUEL COMPLETE")
              print("====================================")
              print(f"Video: {final}")
              print(f"Topic: {topic}")
              print(f"Scene 1: {scene_a}")
              print(f"Scene 2: {scene_b}")
              print(f"Scene 3: {scene_c}")
              print(f"Title: {title}")
              print("====================================")

          if __name__ == "__main__":
              main()
          PY

      - name: Generate Short
        run: |
          python generator/main.py

      - name: Show generated files
        run: |
          echo "=============================="
          echo "GENERATED FILES"
          echo "=============================="
          ls -lah output/

      - name: Upload generated Short
        uses: actions/upload-artifact@v4
        with:
          name: block-fuel-short-${{ github.run_number }}
          path: |
            output/block_fuel_short.mp4
            output/title.txt
            output/description.txt
            output/fact.json
          retention-days: 7
