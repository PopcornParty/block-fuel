name: Block Fuel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow numpy piper-tts

      - name: Download voice
        run: |
          mkdir -p voices
          python -m piper.download_voices en_US-ryan-high --data-dir voices

      - name: Create generator
        run: |
          mkdir -p generator
          cat > generator/main.py <<'PY'
          import os
          import sys
          import math
          import wave
          import random
          import shutil
          import subprocess
          from pathlib import Path

          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter


          # ============================================================
          # BLOCK FUEL
          # Reliable offline Minecraft fact Short generator.
          #
          # No web API.
          # No external footage.
          # No API keys.
          #
          # Visuals are generated specifically for the selected fact.
          # ============================================================


          OUT = Path("output")
          TEMP = Path("temp")
          VOICES = Path("voices")

          OUT.mkdir(exist_ok=True)
          TEMP.mkdir(exist_ok=True)

          WIDTH = 540
          HEIGHT = 960
          FPS = 24
          VIDEO_SECONDS = 27

          random.seed()


          # ------------------------------------------------------------
          # Fonts
          # ------------------------------------------------------------

          FONT_REGULAR = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          FONT_BOLD = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"


          def font(size, bold=False):
              return ImageFont.truetype(
                  FONT_BOLD if bold else FONT_REGULAR,
                  size
              )


          # ------------------------------------------------------------
          # Detailed factual content
          #
          # These are gameplay/mechanics facts designed to be robust
          # across modern Minecraft versions where possible.
          # ------------------------------------------------------------

          FACTS = [

              {
                  "topic": "Creepers",
                  "theme": "creeper",
                  "search": "creeper",
                  "title": "The Creeper Was Never Supposed to Exist",
                  "hook": "Minecraft's most famous enemy started as a complete accident.",
                  "fact": (
                      "The Creeper was created when Minecraft developer Markus Persson "
                      "was trying to make a pig. The model was accidentally made much "
                      "taller than intended, and instead of deleting the mistake, "
                      "the design was turned into a hostile mob. The Creeper eventually "
                      "became one of Minecraft's defining enemies because it silently "
                      "approaches players before exploding. Its distinctive green body, "
                      "four legs and unusual face have remained recognizable throughout "
                      "Minecraft's history."
                  ),
                  "visuals": ["creeper", "forest", "explosion"]
              },

              {
                  "topic": "Redstone",
                  "theme": "redstone",
                  "search": "redstone",
                  "title": "Minecraft's Redstone Is Basically Digital Logic",
                  "hook": "Minecraft has a surprisingly powerful computer system hiding underground.",
                  "fact": (
                      "Redstone can transmit signals through Minecraft's world and can "
                      "be combined with components such as repeaters, comparators, "
                      "observers, pistons and redstone torches. Players can use these "
                      "components to create switches, automatic farms, doors, clocks, "
                      "calculators and even computers. The important part is that "
                      "redstone components follow predictable rules, allowing players "
                      "to build increasingly complicated machines by connecting many "
                      "small pieces of logic together."
                  ),
                  "visuals": ["redstone", "circuit", "machine"]
              },

              {
                  "topic": "Ender Dragon",
                  "theme": "dragon",
                  "search": "ender dragon",
                  "title": "The Ender Dragon Isn't Just a Giant Mob",
                  "hook": "The Ender Dragon fight is built around a mechanic most players overlook.",
                  "fact": (
                      "The Ender Dragon's healing crystals are a major part of the "
                      "fight because they continuously restore the dragon's health "
                      "while it is near them. Players therefore have to deal with the "
                      "End Crystals before they can reliably damage the dragon. "
                      "The crystals sit on tall obsidian pillars around the central "
                      "island, making the battle partly about movement and positioning "
                      "rather than simply attacking the dragon. Destroying the crystals "
                      "changes how the entire fight plays out."
                  ),
                  "visuals": ["end", "crystal", "dragon"]
              },

              {
                  "topic": "Pistons",
                  "theme": "piston",
                  "search": "piston",
                  "title": "Pistons Changed What Minecraft Could Build",
                  "hook": "One block completely changed Minecraft engineering.",
                  "fact": (
                      "Pistons allow players to push blocks when powered by redstone, "
                      "which made it possible to build machines that physically move "
                      "parts of the world. Sticky pistons can also pull certain blocks "
                      "back when their power is removed. This led to enormous numbers "
                      "of player inventions, including hidden doors, elevators, "
                      "automatic farms, flying machines and complicated redstone "
                      "mechanisms. Pistons are one of the main reasons Minecraft "
                      "engineering can go far beyond simple switches."
                  ),
                  "visuals": ["piston", "door", "machine"]
              },

              {
                  "topic": "Villagers",
                  "theme": "village",
                  "search": "villager",
                  "title": "Minecraft Villagers Have Their Own Working System",
                  "hook": "Minecraft villagers don't just stand around waiting for you.",
                  "fact": (
                      "Villagers use job sites to determine their professions and can "
                      "follow daily routines involving work and other activities. "
                      "Different job-site blocks correspond to different professions, "
                      "such as farmers, librarians and toolsmiths. Their trading system "
                      "also gives players a way to obtain useful items without relying "
                      "entirely on crafting or exploration. Villagers can therefore "
                      "become part of large player-built trading systems, especially "
                      "when their workstations and trading arrangements are carefully "
                      "organized."
                  ),
                  "visuals": ["village", "villager", "trading"]
              },

              {
                  "topic": "Ocean Monuments",
                  "theme": "ocean",
                  "search": "ocean monument",
                  "title": "Ocean Monuments Are Basically Underwater Dungeons",
                  "hook": "There are enormous structures hiding beneath Minecraft's oceans.",
                  "fact": (
                      "Ocean Monuments are large underwater structures built primarily "
                      "from prismarine and related blocks. They contain rooms, corridors "
                      "and dangerous guardians, including Elder Guardians. Exploring "
                      "one is difficult because players have to deal with limited "
                      "visibility, water movement and hostile mobs at the same time. "
                      "The monuments can also contain valuable blocks and sponge rooms, "
                      "making them useful targets for players willing to prepare for "
                      "an underwater expedition."
                  ),
                  "visuals": ["ocean", "monument", "guardian"]
              },

              {
                  "topic": "Nether",
                  "theme": "nether",
                  "search": "nether",
                  "title": "The Nether Is Designed to Feel Completely Different",
                  "hook": "Minecraft's Nether isn't simply another dimension with different colours.",
                  "fact": (
                      "The Nether changes several basic rules of exploration. Water "
                      "cannot normally be placed as a regular source there, beds are "
                      "dangerous to use, and the environment contains huge lava seas "
                      "and dangerous terrain. Nether portals also provide a useful "
                      "transport system because distances travelled in the Nether "
                      "correspond to much larger distances in the Overworld. This means "
                      "players can use carefully placed portals to create surprisingly "
                      "fast long-distance travel routes."
                  ),
                  "visuals": ["nether", "lava", "portal"]
              },

              {
                  "topic": "Ancient Cities",
                  "theme": "deep_dark",
                  "search": "ancient city",
                  "title": "Ancient Cities Are Built Around Silence",
                  "hook": "Minecraft has a structure where making too much noise can become the problem.",
                  "fact": (
                      "Ancient Cities generate deep underground in the Deep Dark and "
                      "contain large ruined structures surrounded by sculk. Sculk "
                      "sensors can detect vibrations and help activate nearby sculk "
                      "shriekers. Repeated warnings can eventually cause a Warden to "
                      "appear, turning careless exploration into a serious threat. "
                      "This makes Ancient Cities unusual because success depends heavily "
                      "on movement, timing and awareness rather than simply having "
                      "strong armour and attacking everything nearby."
                  ),
                  "visuals": ["deep_dark", "sculk", "warden"]
              },

              {
                  "topic": "Elytra",
                  "theme": "elytra",
                  "search": "elytra",
                  "title": "The Elytra Completely Changes Minecraft Travel",
                  "hook": "One item can turn Minecraft's entire world into a runway.",
                  "fact": (
                      "The Elytra allows players to glide through the air after jumping "
                      "from a height, dramatically changing how players travel. "
                      "Firework rockets can be used while gliding to provide additional "
                      "forward movement, allowing experienced players to cross huge "
                      "distances quickly. The item is found in End Cities, meaning "
                      "players have to reach the End and explore beyond the main "
                      "dragon island before they can obtain one naturally."
                  ),
                  "visuals": ["elytra", "sky", "end_city"]
              },

              {
                  "topic": "Slimes",
                  "theme": "slime",
                  "search": "slime",
                  "title": "Minecraft Slimes Don't Just Have One Size",
                  "hook": "That giant slime isn't actually the end of the story.",
                  "fact": (
                      "When larger slimes are defeated, they can split into smaller "
                      "slimes instead of simply disappearing. This creates a chain "
                      "where a large slime can produce several smaller versions. "
                      "The mechanic is especially useful for slime farms because "
                      "players can repeatedly defeat the smaller slimes to collect "
                      "slimeballs. Slimeballs are valuable for crafting sticky pistons "
                      "and leads, so what looks like a simple bouncing enemy can become "
                      "an important part of Minecraft engineering and farming."
                  ),
                  "visuals": ["slime", "split", "farm"]
              },

              {
                  "topic": "Enchanting",
                  "theme": "enchanting",
                  "search": "enchanting",
                  "title": "Minecraft's Enchanting System Has More Going On Than Levels",
                  "hook": "That number beside your XP bar isn't the only thing affecting an enchantment.",
                  "fact": (
                      "Enchanting uses experience levels together with an enchanting "
                      "table and nearby bookshelves to provide different enchantment "
                      "options. The available choices are influenced by the setup "
                      "around the table, meaning players can deliberately arrange "
                      "bookshelves to access stronger enchantments. Enchantments can "
                      "then be combined or transferred using tools such as anvils and "
                      "enchanted books. This creates a progression system where players "
                      "can gradually build extremely specialized equipment."
                  ),
                  "visuals": ["enchanting", "bookshelf", "xp"]
              },

              {
                  "topic": "Minecraft World",
                  "theme": "world",
                  "search": "minecraft world",
                  "title": "Minecraft Worlds Are Generated From Rules",
                  "hook": "Every Minecraft world begins with a set of rules that determine what appears.",
                  "fact": (
                      "Minecraft uses a seed to determine the starting information "
                      "used for world generation. Terrain, structures and many other "
                      "features are produced from that world-generation system, which "
                      "is why the same seed can recreate the same general world when "
                      "used with the same relevant generation rules. The seed itself "
                      "is not a saved copy of the entire world. Instead, it acts as "
                      "an input that helps the game generate the world around the "
                      "player."
                  ),
                  "visuals": ["world", "terrain", "seed"]
              },

              {
                  "topic": "Beacon",
                  "theme": "beacon",
                  "search": "minecraft beacon",
                  "title": "Beacons Turn Massive Builds Into Useful Machines",
                  "hook": "That giant pyramid in your base can actually affect players around it.",
                  "fact": (
                      "A beacon can provide useful status effects to nearby players "
                      "when it is powered by a pyramid made from certain mineral blocks. "
                      "Larger pyramid structures unlock more beacon options and can "
                      "increase the beacon's effective range. Because beacons require "
                      "valuable resources and a substantial amount of building space, "
                      "they often become late-game projects. Players commonly place "
                      "them at large bases, mining areas and technical builds where "
                      "their effects can be used repeatedly."
                  ),
                  "visuals": ["beacon", "pyramid", "beam"]
              },

              {
                  "topic": "Copper",
                  "theme": "copper",
                  "search": "copper",
                  "title": "Minecraft Copper Actually Changes Over Time",
                  "hook": "Some Minecraft blocks can literally change appearance as they age.",
                  "fact": (
                      "Copper blocks gradually oxidize when exposed to the environment, "
                      "changing through several visual stages as they age. Players can "
                      "use this mechanic deliberately because different oxidation stages "
                      "have different colours and appearances. Waxing copper prevents "
                      "further oxidation, allowing a player to preserve a particular "
                      "stage. This makes copper unusual among building materials because "
                      "the appearance of a structure can depend not only on which block "
                      "you place, but also on how long you leave it exposed."
                  ),
                  "visuals": ["copper", "oxidation", "building"]
              },

              {
                  "topic": "Hoppers",
                  "theme": "hopper",
                  "search": "minecraft hopper",
                  "title": "Hoppers Are One of Minecraft's Most Important Machines",
                  "hook": "This ordinary-looking block is responsible for a huge amount of Minecraft automation.",
                  "fact": (
                      "Hoppers can move item stacks between containers and other "
                      "inventory-related blocks, making them essential for automated "
                      "storage and farming systems. They can collect items, transfer "
                      "them between containers and work with other redstone components. "
                      "Because hoppers can be connected into larger systems, players "
                      "can build automatic item sorters, storage rooms, furnaces and "
                      "farms. Many complicated Minecraft machines ultimately depend "
                      "on simple item movement through hopper networks."
                  ),
                  "visuals": ["hopper", "storage", "items"]
              },

              {
                  "topic": "Phantoms",
                  "theme": "phantom",
                  "search": "phantom",
                  "title": "Phantoms Punish One Very Specific Habit",
                  "hook": "Minecraft has a flying mob that appears because you've been awake too long.",
                  "fact": (
                      "Phantoms are hostile flying mobs associated with players who "
                      "have not slept for several in-game days. They attack from above, "
                      "which makes them particularly annoying when a player is building "
                      "or travelling outdoors at night. Their behaviour gives sleeping "
                      "a gameplay purpose beyond simply changing the time of day. "
                      "Players who regularly sleep can avoid the problem, while players "
                      "who deliberately stay awake can eventually find themselves "
                      "dealing with repeated aerial attacks."
                  ),
                  "visuals": ["phantom", "night", "moon"]
              },

              {
                  "topic": "Snow Golems",
                  "theme": "snow_golem",
                  "search": "snow golem",
                  "title": "Snow Golems Are Basically Moving Defences",
                  "hook": "You can build a Minecraft mob that automatically throws snowballs at enemies.",
                  "fact": (
                      "Snow Golems can be created by arranging snow blocks and placing "
                      "a carved pumpkin on top. Once created, they behave as friendly "
                      "mobs and can attack certain hostile creatures by throwing "
                      "snowballs. Their attacks usually work more as distraction or "
                      "knockback than as a powerful damage source. Snow Golems can "
                      "therefore be used creatively in player-built defences, although "
                      "their usefulness depends heavily on the environment and the "
                      "enemies they are facing."
                  ),
                  "visuals": ["snow", "snow_golem", "defence"]
              },

              {
                  "topic": "Mobs",
                  "theme": "mobs",
                  "search": "minecraft mobs",
                  "title": "Minecraft's Mobs Follow Different Rules",
                  "hook": "Not every Minecraft mob behaves according to the same rules.",
                  "fact": (
                      "Minecraft mobs are controlled by different behaviour systems "
                      "depending on their type. Some hostile mobs actively search for "
                      "players, some creatures flee from threats, and others have "
                      "special movement or attack mechanics. This is why a Creeper, "
                      "Enderman, Skeleton and Villager can react completely differently "
                      "to the same situation. Understanding those behaviours is an "
                      "important part of survival because players can often predict "
                      "what a mob will do once they understand the rules controlling it."
                  ),
                  "visuals": ["mobs", "skeleton", "enderman"]
              },

              {
                  "topic": "Villager Trading",
                  "theme": "trading",
                  "search": "villager trading",
                  "title": "Villager Trading Can Become an Entire Economy",
                  "hook": "A Minecraft village can be turned into a trading network.",
                  "fact": (
                      "Villager trades give players a renewable way to obtain many "
                      "useful resources. Different professions offer different trade "
                      "tables, and players can improve a villager's trading level by "
                      "using its available trades. Carefully organized trading halls "
                      "can therefore provide large quantities of items without relying "
                      "entirely on random exploration. The system becomes especially "
                      "powerful when players combine villagers with farms that produce "
                      "the resources needed to trade for emeralds."
                  ),
                  "visuals": ["trading", "emerald", "village"]
              },

              {
                  "topic": "Nether Fortress",
                  "theme": "fortress",
                  "search": "nether fortress",
                  "title": "Nether Fortresses Are Important for More Than Loot",
                  "hook": "This dangerous Nether structure can unlock some of Minecraft's biggest progression steps.",
                  "fact": (
                      "Nether Fortresses contain hostile mobs and valuable resources, "
                      "but one of their most important roles is progression. Blazes "
                      "found in fortresses can drop blaze rods, which are used to "
                      "create blaze powder. Blaze powder is needed for important crafting "
                      "and progression tasks, including brewing and preparing for the "
                      "End. This makes finding a fortress a major milestone for players "
                      "moving from basic survival toward the game's later progression."
                  ),
                  "visuals": ["fortress", "blaze", "nether"]
              },

              {
                  "topic": "Furnaces",
                  "theme": "furnace",
                  "search": "minecraft furnace",
                  "title": "Minecraft Furnaces Are More Efficient Than They Look",
                  "hook": "One simple block is the beginning of Minecraft's entire processing system.",
                  "fact": (
                      "Furnaces convert certain input items into useful outputs while "
                      "consuming fuel. They are used for everything from smelting ores "
                      "to cooking food and processing building materials. Minecraft "
                      "also includes specialized furnace blocks with different purposes, "
                      "which means players can create larger processing setups when "
                      "they need to handle many items. Once hoppers and storage are "
                      "added, furnaces can become part of fully automated systems "
                      "that process and sort items without constant player input."
                  ),
                  "visuals": ["furnace", "smelting", "items"]
              },

              {
                  "topic": "End Cities",
                  "theme": "end_city",
                  "search": "end city",
                  "title": "End Cities Hide Some of Minecraft's Most Valuable Gear",
                  "hook": "The End has another challenge waiting after the dragon.",
                  "fact": (
                      "End Cities are large structures that generate in the outer End "
                      "islands. They contain valuable loot and can include special "
                      "structures called End Ships. End Ships are particularly important "
                      "because they can contain an Elytra, giving players a way to glide "
                      "through the world. Reaching these structures requires travelling "
                      "beyond the main End island, so obtaining an Elytra represents "
                      "another stage of progression after defeating the Ender Dragon."
                  ),
                  "visuals": ["end_city", "ship", "elytra"]
              }

          ]


          # ------------------------------------------------------------
          # Utility
          # ------------------------------------------------------------

          def run(cmd, **kwargs):
              print("$", " ".join(str(x) for x in cmd))
              return subprocess.run(
                  cmd,
                  check=True,
                  text=True,
                  **kwargs
              )


          def run_capture(cmd):
              return subprocess.check_output(
                  cmd,
                  text=True,
                  stderr=subprocess.STDOUT
              ).strip()


          def get_audio_duration(path):
              cmd = [
                  "ffprobe",
                  "-v", "error",
                  "-show_entries", "format=duration",
                  "-of", "default=noprint_wrappers=1:nokey=1",
                  str(path)
              ]

              try:
                  return float(run_capture(cmd))
              except Exception:
                  return 0.0


          # ------------------------------------------------------------
          # Topic colours
          # ------------------------------------------------------------

          THEMES = {
              "creeper": ((28, 55, 34), (110, 210, 65)),
              "redstone": ((35, 8, 10), (210, 35, 30)),
              "dragon": ((18, 10, 35), (145, 65, 205)),
              "piston": ((55, 48, 36), (180, 145, 80)),
              "village": ((48, 30, 18), (205, 145, 60)),
              "ocean": ((5, 35, 65), (35, 170, 210)),
              "nether": ((55, 8, 8), (220, 55, 20)),
              "deep_dark": ((8, 13, 20), (35, 125, 130)),
              "elytra": ((10, 30, 50), (80, 180, 230)),
              "slime": ((20, 55, 25), (80, 220, 90)),
              "enchanting": ((28, 10, 55), (170, 80, 230)),
              "world": ((20, 50, 25), (80, 180, 90)),
              "beacon": ((10, 35, 45), (100, 240, 255)),
              "copper": ((60, 28, 15), (70, 190, 170)),
              "hopper": ((35, 35, 38), (150, 150, 160)),
              "phantom": ((12, 18, 35), (80, 120, 210)),
              "snow_golem": ((35, 60, 80), (220, 245, 255)),
              "mobs": ((25, 20, 35), (150, 100, 190)),
              "trading": ((30, 55, 30), (80, 200, 100)),
              "fortress": ((55, 18, 10), (190, 65, 35)),
              "furnace": ((38, 32, 30), (240, 115, 35)),
              "end_city": ((18, 12, 45), (150, 95, 220))
          }


          def theme_for(fact):
              return THEMES.get(
                  fact["theme"],
                  ((20, 25, 35), (100, 150, 220))
              )


          # ------------------------------------------------------------
          # Minecraft-style drawing helpers
          # ------------------------------------------------------------

          def rect_block(draw, x, y, w, h, color, outline=None):
              draw.rectangle(
                  [int(x), int(y), int(x + w), int(y + h)],
                  fill=color,
                  outline=outline
              )


          def pixel_cube(draw, x, y, size, top, front, side):
              x = int(x)
              y = int(y)
              s = int(size)

              depth = max(4, s // 5)

              draw.polygon(
                  [
                      (x, y),
                      (x + s, y),
                      (x + s - depth, y + depth),
                      (x + depth, y + depth)
                  ],
                  fill=top
              )

              draw.polygon(
                  [
                      (x + depth, y + depth),
                      (x + s - depth, y + depth),
                      (x + s - depth, y + s),
                      (x + depth, y + s)
                  ],
                  fill=front
              )

              draw.polygon(
                  [
                      (x + s - depth, y + depth),
                      (x + s, y),
                      (x + s, y + s - depth),
                      (x + s - depth, y + s)
                  ],
                  fill=side
              )


          def draw_grid(draw, offset, color):
              size = 54
              horizon = 580

              for y in range(horizon, HEIGHT + 100, size):
                  yy = y + int(offset * 0.7) % size
                  draw.line(
                      [(0, yy), (WIDTH, yy)],
                      fill=color,
                      width=2
                  )

              for x in range(-WIDTH, WIDTH * 2, size):
                  xx = x + int(offset) % size
                  draw.line(
                      [(WIDTH // 2, horizon), (xx, HEIGHT)],
                      fill=color,
                      width=2
                  )


          def draw_particles(draw, rng, count, t, c1, c2):
              for i in range(count):
                  x = rng.randrange(WIDTH)
                  base_y = rng.randrange(80, HEIGHT)

                  y = (
                      base_y
                      - int((t * (15 + i % 20)) % (HEIGHT + 100))
                  )

                  r = 2 + (i % 4)

                  color = c1 if i % 2 == 0 else c2

                  draw.rectangle(
                      [x, y, x + r, y + r],
                      fill=color
                  )


          # ------------------------------------------------------------
          # Individual themed scenes
          # ------------------------------------------------------------

          def scene_creeper(draw, t, rng, c1, c2):
              ground = 650

              for x in range(0, WIDTH, 45):
                  rect_block(
                      draw,
                      x,
                      ground,
                      45,
                      90,
                      (48, 105, 45)
                  )

              # Creeper moves towards camera.
              scale = 1.0 + 0.15 * math.sin(t * 1.5)
              size = int(210 * scale)

              cx = WIDTH // 2
              cy = 500

              x = cx - size // 2
              y = cy - size // 2

              green = (55, 155, 65)
              dark = (20, 45, 25)

              rect_block(draw, x + size * .18, y, size * .64, size * .62, green)

              # legs
              rect_block(draw, x + size * .20, y + size * .55, size * .22, size * .45, green)
              rect_block(draw, x + size * .58, y + size * .55, size * .22, size * .45, green)

              # face
              eye = int(size * .12)

              rect_block(draw, x + size * .30, y + size * .22, eye, eye, dark)
              rect_block(draw, x + size * .58, y + size * .22, eye, eye, dark)

              rect_block(draw, x + size * .42, y + size * .35, eye, int(eye * 1.7), dark)
              rect_block(draw, x + size * .30, y + size * .45, int(eye * 1.4), eye, dark)
              rect_block(draw, x + size * .58, y + size * .45, int(eye * 1.4), eye, dark)

              # charging/explosion warning
              pulse = (math.sin(t * 7) + 1) / 2

              if pulse > .72:
                  glow = Image.new("RGBA", (WIDTH, HEIGHT), (255, 120, 40, 0))
                  gd = ImageDraw.Draw(glow)

                  for r in range(20, 220, 25):
                      alpha = max(0, int(70 - r / 4))
                      gd.ellipse(
                          [
                              cx - r,
                              cy - r,
                              cx + r,
                              cy + r
                          ],
                          outline=(255, 190, 60, alpha),
                          width=8
                      )

                  glow = glow.filter(ImageFilter.GaussianBlur(8))
                  draw._image.alpha_composite(glow)


          def scene_redstone(draw, t, rng, c1, c2):
              draw_grid(draw, t * 50, (60, 35, 35))

              # Circuit path
              y = 520

              for i in range(8):
