          def search_pexels(query):
              if not PEXELS_KEY:
                  raise RuntimeError(
                      "PEXELS_API_KEY is missing. "
                      "Add it in GitHub Settings > Secrets and variables > Actions."
                  )

              response = requests.get(
                  "https://api.pexels.com/v1/videos/search",
                  headers={
                      "Authorization": PEXELS_KEY
                  },
                  params={
                      "query": query,
                      "orientation": "portrait",
                      "size": "medium",
                      "per_page": 30
                  },
                  timeout=30
              )

              print("Pexels status:", response.status_code)

              if response.status_code != 200:
                  raise RuntimeError(
                      f"Pexels API failed: {response.status_code} "
                      f"{response.text[:500]}"
                  )

              data = response.json()

              videos = data.get("videos", [])

              if not videos:
                  raise RuntimeError(
                      f"Pexels returned no videos for '{query}'."
                  )

              return videos


          def choose_video_file(video):
              files = video.get("video_files", [])

              usable = []

              for item in files:
                  link = item.get("link")
                  width = item.get("width", 0)
                  height = item.get("height", 0)

                  if not link:
                      continue

                  if width < 300 or height < 300:
                      continue

                  usable.append(item)

              if not usable:
                  return None

              portrait = [
                  x for x in usable
                  if x.get("height", 0) > x.get("width", 0)
              ]

              if portrait:
                  usable = portrait

              usable.sort(
                  key=lambda x: abs(
                      (x.get("width", 720) or 720) - 720
                  )
              )

              return usable[0]


          def download_video(video, number):
              selected = choose_video_file(video)

              if not selected:
                  return None

              link = selected["link"]

              destination = DOWNLOADS / f"source_{number}.mp4"

              print("Downloading:", link)

              with requests.get(
                  link,
                  stream=True,
                  timeout=120
              ) as response:

                  if response.status_code != 200:
                      return None

                  with open(destination, "wb") as f:
                      for chunk in response.iter_content(
                          chunk_size=1024 * 512
                      ):
                          if chunk:
                              f.write(chunk)

              if destination.stat().st_size < 100000:
                  destination.unlink(missing_ok=True)
                  return None

              # Verify ffmpeg can actually read it.
              try:
                  d = duration(destination)

                  if d <= 0.5:
                      destination.unlink(missing_ok=True)
                      return None

              except Exception:
                  destination.unlink(missing_ok=True)
                  return None

              return destination


          def get_real_clips():
              # Search the actual Minecraft-related concept first.
              videos = search_pexels(fact["search"])

              random.shuffle(videos)

              clips = []

              for number, video in enumerate(videos):
                  downloaded = download_video(video, number)

                  if downloaded:
                      clips.append(downloaded)

                  if len(clips) >= 4:
                      break

              if len(clips) < 4:
                  raise RuntimeError(
                      "Could not obtain four usable real video clips "
                      "from Pexels. The workflow will NOT create a blank "
                      "fallback video."
                  )

              return clips


          # ============================================================
          # VIDEO PROCESSING
          # ============================================================

          def make_segment(source, output, number):
              # Every segment is exactly 5 seconds.
              #
              # - Loops a short source if necessary.
              # - Fills the 720x1280 canvas.
              # - Uses animated crop movement.
              # - Adds subtle contrast/saturation.
              #

              if number == 0:
                  x = "iw/2-(iw/zoom/2)"
                  y = "ih/2-(ih/zoom/2)"
              elif number == 1:
                  x = "iw/2-(iw/zoom/2)+35*sin(t*0.7)"
                  y = "ih/2-(ih/zoom/2)"
              elif number == 2:
                  x = "iw/2-(iw/zoom/2)-35*sin(t*0.6)"
                  y = "ih/2-(ih/zoom/2)+25*cos(t*0.8)"
              else:
                  x = "iw/2-(iw/zoom/2)+25*cos(t*0.6)"
                  y = "ih/2-(ih/zoom/2)-25*sin(t*0.5)"

              vf = (
                  "scale=720:1280:force_original_aspect_ratio=increase,"
                  "crop=720:1280:"
                  f"{x}:"
                  f"{y},"
                  "setsar=1,"
                  "eq=contrast=1.08:saturation=1.12:brightness=0.01,"
                  "vignette=PI/5,"
                  "fps=30,"
                  "format=yuv420p"
              )

              # Zoom is done using the scale before crop.
              #
              # The input is scaled to fill the portrait frame, then
              # the animated crop provides camera movement.

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-stream_loop",
                  "-1",
                  "-i",
                  str(source),
                  "-t",
                  "5",
                  "-vf",
                  vf,
                  "-an",
                  "-r",
                  "30",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "20",
                  "-pix_fmt",
                  "yuv420p",
                  str(output)
              ]

              run(cmd, quiet=True)


          def join_segments(segments, output):
              concat_file = SEGMENTS / "concat.txt"

              with open(concat_file, "w", encoding="utf-8") as f:
                  for segment in segments:
                      f.write(
                          "file '"
                          + str(segment.resolve()).replace("'", "'\\''")
                          + "'\n"
                      )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_file),
                  "-t",
                  "20",
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "19",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  str(output)
              ]

              run(cmd, quiet=True)

              d = duration(output)

              if d < 19.5 or d > 20.5:
                  raise RuntimeError(
                      f"Bad video duration: {d}"
                  )


          # ============================================================
          # NEURAL VOICE
          # ============================================================

          def make_voice_part(text, filename):
              output = OUT / filename

              cmd = [
                  "python",
                  "-m",
                  "piper",
                  "--data-dir",
                  str(VOICE_DIR),
                  "-m",
                  "en_GB-alan-medium",
                  "-f",
                  str(output),
                  "--",
                  text
              ]

              run(cmd, quiet=True)

              if not output.exists():
                  raise RuntimeError(
                      f"Piper failed to create {output}"
                  )

              if duration(output) <= 0.1:
                  raise RuntimeError(
                      f"Piper produced empty audio: {output}"
                  )

              return output


          # ============================================================
          # CAPTIONS
          # ============================================================

          def ass_time(seconds):
              hours = int(seconds // 3600)
              minutes = int((seconds % 3600) // 60)
              seconds = seconds % 60

              return (
                  f"{hours}:"
                  f"{minutes:02d}:"
                  f"{seconds:05.2f}"
              )


          def escape_ass(text):
              return (
                  text
                  .replace("\\", "")
                  .replace("{", "")
                  .replace("}", "")
                  .replace("\n", " ")
              )


          def create_captions(parts, output):
              lines = []

              # Start each caption exactly when its corresponding
              # Piper audio begins.
              current = 0.0

              for text, audio in parts:
                  d = duration(audio)

                  words = text.split()

                  if not words:
                      current += d
                      continue

                  # Break into small groups.
                  group_size = 4

                  for index in range(0, len(words), group_size):
                      group = words[index:index + group_size]

                      start = current + (
                          d * index / len(words)
                      )

                      end = current + (
                          d * min(
                              index + len(group),
                              len(words)
                          ) / len(words)
                      )

                      caption = escape_ass(
                          " ".join(group)
                      )

                      lines.append(
                          "Dialogue: 0,"
                          f"{ass_time(start)},"
                          f"{ass_time(end)},"
                          "Caption,,0,0,0,,"
                          "{\\fad(80,80)"
                          "\\t(0,100,\\fscx108\\fscy108)}"
                          + caption
                      )

                  current += d

              ass = f"""[Script Info]
          ScriptType: v4.00+
          PlayResX: 720
          PlayResY: 1280

          [V4+ Styles]
          Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding
          Style: Caption,DejaVu Sans,43,&H00FFFFFF,&H00FFFFFF,&H00101010,&H90000000,1,0,0,0,100,100,0,0,1,4,2,2,42,42,220,1

          [Events]
          Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text
          {chr(10).join(lines)}
          """

              output.write_text(
                  ass,
                  encoding="utf-8"
              )


          # ============================================================
          # MUSIC
          # ============================================================

          def create_music(output):
              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "lavfi",
                  "-i",
                  (
                      "aevalsrc="
                      "0.055*sin(2*PI*55*t)"
                      "+0.025*sin(2*PI*82.41*t)"
                      "+0.020*sin(2*PI*110*t)"
                      "+0.012*sin(2*PI*164.81*t)"
                      ":s=44100"
                  ),
                  "-t",
                  "20",
                  "-af",
                  (
                      "afade=t=in:st=0:d=1.5,"
                      "afade=t=out:st=17.5:d=2.5,"
                      "lowpass=f=1800,"
                      "acompressor=threshold=-20dB:ratio=3:attack=10:release=120"
                  ),
                  "-ar",
                  "44100",
                  "-ac",
                  "2",
                  str(output)
              ]

              run(cmd, quiet=True)


          # ============================================================
          # FINAL VIDEO
          # ============================================================

          def add_overlay(video, captions, output):
              filtergraph = (
                  "drawbox="
                  "x=25:y=42:w=670:h=82:"
                  "color=black@0.55:t=fill,"
                  "drawtext="
                  "fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:"
                  "text='BLOCK FUEL':"
                  "fontcolor=white:"
                  "fontsize=32:"
                  "x=(w-text_w)/2:"
                  "y=65:"
                  "enable='between(t,0,2.5)',"
                  "ass="
                  + str(captions)
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(video),
                  "-vf",
                  filtergraph,
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "19",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  str(output)
              ]

              run(cmd, quiet=True)


          def combine_audio(video, audio_parts, music, output):
              # Concatenate the three voice sections.
              voice_concat = OUT / "voice_concat.txt"
              voice_full = OUT / "voice_full.wav"

              with open(voice_concat, "w", encoding="utf-8") as f:
                  for audio in audio_parts:
                      f.write(
                          "file '"
                          + str(audio.resolve()).replace(
                              "'",
                              "'\\''"
                          )
                          + "'\n"
                      )

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(voice_concat),
                  "-c:a",
                  "pcm_s16le",
                  str(voice_full)
              ], quiet=True)

              # Voice is kept loud.
              # Music sits underneath it.
              cmd = [
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(video),
                  "-i",
                  str(voice_full),
                  "-i",
                  str(music),
                  "-filter_complex",
                  (
                      "[1:a]"
                      "loudnorm=I=-16:TP=-1.5:LRA=11,"
                      "acompressor=threshold=-18dB:ratio=3:attack=5:release=80,"
                      "volume=1.10"
                      "[voice];"
                      "[2:a]"
                      "volume=0.16"
                      "[music];"
                      "[voice][music]"
                      "amix=inputs=2:duration=first:"
                      "dropout_transition=2,"
                      "loudnorm=I=-14:TP=-1.5:LRA=11"
                      "[audio]"
                  ),
                  "-map",
                  "0:v",
                  "-map",
                  "[audio]",
                  "-t",
                  "20",
                  "-c:v",
                  "copy",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-movflags",
                  "+faststart",
                  str(output)
              ]

              run(cmd, quiet=True)


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              print("=" * 70)
              print("BLOCK FUEL GENERATOR")
              print("=" * 70)

              print("FACT:")
              print(fact_text)

              print()
              print("SEARCH:")
              print(fact["search"])

              print()
              print("VOICE:")
              print(hook)
              print(fact_text)
              print(ending)

              # --------------------------------------------------------
              # Require real footage.
              # --------------------------------------------------------

              clips = get_real_clips()

              print()
              print("REAL CLIPS:")
              for clip in clips:
                  print(clip)

              # --------------------------------------------------------
              # Create four completely separate shots.
              # --------------------------------------------------------

              segments = []

              for i, clip in enumerate(clips):
                  segment = SEGMENTS / f"shot_{i}.mp4"

                  make_segment(
                      clip,
                      segment,
                      i
                  )

                  segments.append(segment)

              raw_video = OUT / "raw_video.mp4"

              join_segments(
                  segments,
                  raw_video
              )

              # --------------------------------------------------------
              # Generate voice in THREE pieces.
              #
              # This is what fixes the subtitle timing.
              # --------------------------------------------------------

              hook_audio = make_voice_part(
                  hook,
                  "voice_hook.wav"
              )

              fact_audio = make_voice_part(
                  fact_text,
                  "voice_fact.wav"
              )

              ending_audio = make_voice_part(
                  ending,
                  "voice_ending.wav"
              )

              audio_parts = [
                  (hook, hook_audio),
                  (fact_text, fact_audio),
                  (ending, ending_audio)
              ]

              voice_duration = (
                  duration(hook_audio)
                  + duration(fact_audio)
                  + duration(ending_audio)
              )

              print(
                  "Total narration duration:",
                  voice_duration
              )

              if voice_duration > 19.2:
                  raise RuntimeError(
                      "Narration is too long for the 20 second Short."
                  )

              # --------------------------------------------------------
              # Captions based on ACTUAL Piper audio durations.
              # --------------------------------------------------------

              captions = OUT / "captions.ass"

              create_captions(
                  audio_parts,
                  captions
              )

              # --------------------------------------------------------
              # Music
              # --------------------------------------------------------

              music = OUT / "music.wav"

              create_music(music)

              # --------------------------------------------------------
              # Overlay
              # --------------------------------------------------------

              graphics = OUT / "graphics.mp4"

              add_overlay(
                  raw_video,
                  captions,
                  graphics
              )

              # --------------------------------------------------------
              # Final audio/video
              # --------------------------------------------------------

              final_video = OUT / "block_fuel_short.mp4"

              combine_audio(
                  graphics,
                  [hook_audio, fact_audio, ending_audio],
                  music,
                  final_video
              )

              # --------------------------------------------------------
              # Metadata
              # --------------------------------------------------------

              title_options = [
                  "You probably didn't know this Minecraft fact",
                  "This Minecraft mechanic is easy to miss",
                  "Most Minecraft players don't know this",
                  "Minecraft has a mechanic like THIS?",
                  "You probably never noticed this in Minecraft",
                  "This Minecraft fact is actually wild"
              ]

              title = random.choice(title_options)

              description = (
                  fact_text
                  + "\n\n"
                  + "Minecraft facts, mechanics and secrets."
                  + "\n"
                  + "New Shorts from Block Fuel."
                  + "\n\n"
                  + "Footage provided by Pexels."
                  + "\n"
                  + "https://www.pexels.com/"
                  + "\n\n"
                  + "#Minecraft #MinecraftFacts #Gaming #Shorts"
              )

              (OUT / "title.txt").write_text(
                  title,
                  encoding="utf-8"
              )

              (OUT / "description.txt").write_text(
                  description,
                  encoding="utf-8"
              )

              (OUT / "fact.json").write_text(
                  json.dumps(
                      {
                          "fact": fact_text,
                          "search": fact["search"],
                          "voice": "en_GB-alan-medium",
                          "real_web_footage": True,
                          "source": "Pexels",
                          "video_duration": duration(final_video),
                          "narration_duration": voice_duration
                      },
                      indent=2
                  ),
                  encoding="utf-8"
              )

              # --------------------------------------------------------
              # HARD CHECKS
              # --------------------------------------------------------

              final_duration = duration(final_video)

              if final_duration < 19.0:
                  raise RuntimeError(
                      f"Final video is too short: {final_duration}"
                  )

              if final_duration > 20.5:
                  raise RuntimeError(
                      f"Final video is too long: {final_duration}"
                  )

              print()
              print("=" * 70)
              print("SUCCESS")
              print("=" * 70)
              print("Video:", final_video)
              print("Duration:", final_duration)
              print("Narration:", voice_duration)
              print("Real footage: YES")
              print("=" * 70)


          if __name__ == "__main__":
              main()
          PY

      - name: Generate Short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python generator/main.py

      - name: Verify final video
        run: |
          test -s output/block_fuel_short.mp4

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output/block_fuel_short.mp4

          echo "FINAL VIDEO:"
          ls -lh output/block_fuel_short.mp4

      - name: Upload Short
        uses: actions/upload-artifact@v4
        with:
          name: block-fuel-short-${{ github.run_number }}
          path: |
            output/block_fuel_short.mp4
            output/title.txt
            output/description.txt
            output/fact.json
          retention-days: 7
