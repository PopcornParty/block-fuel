                  [
                      hx + 25,
                      hy + 8,
                      hx + 50,
                      hy + 33
                  ],
                  fill=(255, 40, 40)
              )

              # Wings
              draw.polygon(
                  [
                      (cx - 30, cy - 50),
                      (cx - 250, cy - 320 - wing),
                      (cx - 60, cy - 30)
                  ],
                  fill=(62, 12, 70)
              )

              draw.polygon(
                  [
                      (cx + 30, cy - 40),
                      (cx + 240, cy - 310 + wing),
                      (cx + 80, cy - 10)
                  ],
                  fill=(62, 12, 70)
              )

              # Purple energy
              particles(
                  draw,
                  rng,
                  t,
                  (180, 70, 255),
                  110
              )

              # End crystals
              for i in range(4):
                  x = 120 + i * 280

                  pulse = (
                      math.sin(t * 5 + i) + 1
                  ) / 2

                  draw.line(
                      [
                          (x, 1200),
                          (x, 1050)
