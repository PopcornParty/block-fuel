              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "lavfi",
                  "-i",
                  (
                      "aevalsrc="
                      "0.08*sin(2*PI*55*t)"
                      "+0.035*sin(2*PI*82.41*t)"
                      "+0.025*sin(2*PI*110*t)"
                      "+0.015*sin(2*PI*164.81*t)"
                      ":s=44100"
                  ),
                  "-f",
                  "lavfi",
                  "-i",
                  (
                      "aevalsrc="
                      "0.018*sin(2*PI*220*t)"
                      "+0.014*sin(2*PI*277.18*t)"
                      "+0.010*sin(2*PI*329.63*t)"
                      ":s=44100"
                  ),
                  "-filter_complex",
                  (
                      "[0:a]volume=0.75,"
                      "afade=t=in:st=0:d=2,"
                      "afade=t=out:st=17:d=3[a];"
                      "[1:a]volume=0.45,"
