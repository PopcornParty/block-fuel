name: Block Fuel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu curl unzip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy requests piper-tts

      - name: Download neural voice
        run: |
          mkdir -p voice
          python -m piper.download_voices en_GB-alan-medium --data-dir voice

      - name: Create generator
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p generator
          cat > generator/main.py <<'PY'
          import os
          import sys
          import json
          import math
          import random
          import time
          import shutil
          import subprocess
          from pathlib import Path

          import requests
          import numpy as np
          from PIL import Image, ImageDraw, ImageFont, ImageFilter

          # ============================================================
          # BLOCK FUEL
          # Real Minecraft facts + real web video + neural narration
          # ============================================================

          W = 720
          H = 1280
          FPS = 30
          DURATION = 20
          TOTAL_FRAMES = FPS * DURATION

          ROOT = Path.cwd()
          OUT = ROOT / "output"
          OUT.mkdir(exist_ok=True)

          CLIPS = ROOT / "downloaded_clips"
          CLIPS.mkdir(exist_ok=True)

          PEXELS_KEY = os.environ.get("PEXELS_API_KEY", "").strip()

          random.seed(int(time.time() * 1000000) ^ os.getpid())

          # ------------------------------------------------------------
          # Fonts
          # ------------------------------------------------------------

          FONT_REG = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          FONT_BOLD = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"

          def font(size, bold=False):
              return ImageFont.truetype(
                  FONT_BOLD if bold else FONT_REG,
                  size
              )

