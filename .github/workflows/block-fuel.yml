          def make_voice(text, output):
              output = Path(output)

              if output.exists():
                  output.unlink()

              model = VOICES / "en_US-ryan-high.onnx"

              if not model.exists():
                  # Fallback if Piper placed it elsewhere.
                  candidates = list(VOICES.rglob("en_US-ryan-high.onnx"))

                  if candidates:
                      model = candidates[0]

              if not model.exists():
                  raise RuntimeError(
                      "Piper voice model was not downloaded correctly."
                  )

              cmd = [
                  sys.executable,
                  "-m",
                  "piper",
                  "-m",
                  "en_US-ryan-high",
                  "--data-dir",
                  str(VOICES),
                  "-f",
                  str(output),
                  "--",
                  text
              ]

              run(cmd)

              if not output.exists():
                  raise RuntimeError(
                      f"Piper did not create {output}"
                  )

              duration = get_audio_duration(output)

              if duration <= 0:
                  raise RuntimeError(
                      f"Generated voice file has no readable duration: {output}"
                  )

              return duration


          # ------------------------------------------------------------
          # Audio
          # ------------------------------------------------------------

          def make_music(duration, output):
              sample_rate = 44100
              count = int(duration * sample_rate)

              t = np.arange(count) / sample_rate

              # Cinematic layered drone.
              bass = (
                  0.10 * np.sin(2 * np.pi * 55 * t)
                  + 0.06 * np.sin(2 * np.pi * 82.4 * t)
              )

              pad = (
                  0.025 * np.sin(2 * np.pi * 110 * t)
                  + 0.018 * np.sin(2 * np.pi * 164.8 * t)
              )

              pulse = (
                  0.025
                  * np.sin(2 * np.pi * 2.0 * t)
              )

              # Gentle fade.
              fade = np.ones_like(t)

              fade_len = min(
                  sample_rate * 1.5,
                  len(t) // 2
              )

              fade[:fade_len] = np.linspace(
                  0,
                  1,
                  fade_len
              )

              fade[-fade_len:] = np.linspace(
                  1,
                  0,
                  fade_len
              )

              audio = (bass + pad + pulse) * fade

              audio = np.clip(
                  audio,
                  -0.25,
                  0.25
              )

              pcm = (
                  audio * 32767
              ).astype(np.int16)

              with wave.open(str(output), "wb") as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(sample_rate)
                  wf.writeframes(pcm.tobytes())


          # ------------------------------------------------------------
          # Subtitle generation
          #
          # Each spoken section gets its real measured duration.
          # This is much safer than guessing one timing across the
          # entire narration.
          # ------------------------------------------------------------

          def ass_time(seconds):
              cs = int(round(seconds * 100))
              h = cs // 360000
              cs %= 360000
              m = cs // 6000
              cs %= 6000
              s = cs // 100
              centi = cs % 100

              return f"{h}:{m:02d}:{s:02d}.{centi:02d}"


          def split_caption(text, max_chars=34):
              words = text.split()

              lines = []
              current = ""

              for word in words:
                  candidate = (
                      word
                      if not current
                      else current + " " + word
                  )

                  if len(candidate) <= max_chars:
                      current = candidate
                  else:
                      if current:
                          lines.append(current)

                      current = word

              if current:
                  lines.append(current)

              # Keep it readable.
              if len(lines) <= 2:
                  return "\\N".join(lines)

              midpoint = len(lines) // 2

              return (
                  " ".join(lines[:midpoint])
                  + "\\N"
                  + " ".join(lines[midpoint:])
              )


          def create_ass(sections, output):
              lines = [
                  "[Script Info]",
                  "ScriptType: v4.00+",
                  "PlayResX: 540",
                  "PlayResY: 960",
                  "",
                  "[V4+ Styles]",
                  (
                      "Style: Default,"
                      "DejaVu Sans,"
                      "34,"
                      "&H00FFFFFF,"
                      "&H00000000,"
                      "&H80000000,"
                      "&H00000000,"
                      "0,"
                      "0,"
                      "0,"
                      "0,"
                      "100,"
                      "100,"
                      "0,"
                      "0,"
                      "1,"
                      "3,"
                      "2,"
                      "5,"
                      "25,"
                      "25,"
                      "60,"
                      "25"
                  ),
                  "",
                  "[Events]",
                  "Format: Layer, Start, End, Style, Text"
              ]

              current = 0.0

              for text, duration in sections:
                  start = current
                  end = current + duration

                  caption = split_caption(text)

                  lines.append(
                      "Dialogue: 0,"
                      f"{ass_time(start)},"
                      f"{ass_time(end)},"
                      f"Default,"
                      f"{caption}"
                  )

                  current = end

              Path(output).write_text(
                  "\n".join(lines),
                  encoding="utf-8"
              )


          # ------------------------------------------------------------
          # Render video directly into FFmpeg.
          #
          # This avoids thousands of PNG files and prevents the old
          # blank-screen/looping problem.
          # ------------------------------------------------------------

          def render_video(theme, durations, output):
              total = sum(durations)

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "rawvideo",
                  "-pix_fmt",
                  "rgb24",
                  "-s",
                  f"{WIDTH}x{HEIGHT}",
                  "-r",
                  str(FPS),
                  "-i",
                  "-",
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "21",
                  "-pix_fmt",
                  "yuv420p",
                  "-movflags",
                  "+faststart",
                  "-t",
                  f"{total:.3f}",
                  str(output)
              ]

              process = subprocess.Popen(
                  cmd,
                  stdin=subprocess.PIPE
              )

              rng = random.Random(
                  int.from_bytes(
                      os.urandom(8),
                      "little"
                  )
              )

              elapsed = 0.0

              try:
                  for scene_index, duration in enumerate(durations):

                      scene_start = elapsed

                      frames = max(
                          1,
                          int(round(duration * FPS))
                      )

                      for frame in range(frames):
                          local_t = frame / FPS
                          global_t = scene_start + local_t

                          image = render_frame(
                              theme,
                              scene_index,
                              local_t,
                              global_t,
                              rng
                          )

                          process.stdin.write(
                              image.tobytes()
                          )

                      elapsed += duration

                  process.stdin.close()

                  code = process.wait()

                  if code != 0:
                      raise RuntimeError(
                          f"FFmpeg video encoding failed with code {code}"
                      )

              except Exception:
                  try:
                      process.stdin.close()
                  except Exception:
                      pass

                  process.kill()
                  process.wait()

                  raise


