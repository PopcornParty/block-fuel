                  ),
              },

              {
                  "topic": "Fire",
                  "theme": "fire",
                  "title": "Fire Can Spread",
                  "hook": "Leaving a wooden build next to fire can become a serious problem.",
                  "fact": (
                      "Fire can spread to certain nearby flammable blocks and can destroy wooden structures "
