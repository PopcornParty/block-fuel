              )


          def scene_forest(draw, t, rng):
              draw_sky(
                  draw,
                  (55, 105, 160),
                  (160, 200, 220)
              )

              terrain(
                  draw,
                  rng,
                  1500,
                  (60, 120, 60)
              )

              # Trees
              for i in range(8):
                  x = 60 + i * 140
                  trunk_h = 300 + (i % 3) * 80

                  draw.rectangle(
                      [
                          x,
                          1500 - trunk_h,
                          x + 70,
                          1500
                      ],
                      fill=(95, 60, 35)
                  )

                  for j in range(5):
                      draw.ellipse(
                          [
                              x - 80 + j * 25,
                              1300 - trunk_h // 2 - j * 15,
                              x + 130 + j * 20,
                              1500 - trunk_h // 2 + 120
                          ],
                          fill=rng.choice([
                              (40, 125, 50),
                              (50, 145, 55),
                              (65, 160, 60)
                          ])
                      )

              particles(
                  draw,
                  rng,
