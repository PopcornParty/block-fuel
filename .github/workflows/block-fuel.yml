name: Block Fuel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */1 * * *"

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg and voice tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy

      - name: Generate Block Fuel Short
        shell: bash
        run: |
          cat > create_video.py <<'PY'
          import os
          import random
          import math
          import wave
          import subprocess
          from PIL import Image, ImageDraw, ImageFont
          import numpy as np

          WIDTH = 1080
          HEIGHT = 1920
          FPS = 30
          DURATION = 20

          os.makedirs("output", exist_ok=True)

          # ---------------------------------------------------------
          # REAL MINECRAFT FACTS
          # ---------------------------------------------------------

          facts = [
              {
                  "hook": "Did you know Minecraft has a mob that can pick up blocks?",
                  "body": "Endermen can pick up certain blocks and place them somewhere else.",
                  "ending": "That's one reason you can sometimes find blocks where they shouldn't be."
              },
              {
                  "hook": "Here's a strange Minecraft fact.",
                  "body": "Creepers were created because the developer accidentally made a pig with the wrong dimensions.",
                  "ending": "That mistake eventually became one of Minecraft's most famous mobs."
              },
              {
                  "hook": "Minecraft's Nether has a weird connection to distance.",
                  "body": "One block travelled in the Nether corresponds to eight blocks travelled in the Overworld.",
                  "ending": "That's why Nether portals can be used for fast travel."
              },
              {
                  "hook": "Did you know Minecraft's first version wasn't called Minecraft?",
                  "body": "The game was originally called Cave Game during its early development.",
                  "ending": "The name Minecraft came later."
              },
              {
                  "hook": "Here's a useful Minecraft fact.",
                  "body": "Water can flow up to eight blocks horizontally from its source in the Overworld.",
                  "ending": "That's why water streams can travel surprisingly far."
              },
              {
                  "hook": "Ever wondered why Creepers are green?",
                  "body": "The Creeper's appearance became iconic because of its unusual tall, green design.",
                  "ending": "And today, it's one of the most recognisable Minecraft mobs."
              },
              {
                  "hook": "Minecraft has a mob that can teleport.",
                  "body": "Endermen can teleport when they move around, making them difficult to trap.",
                  "ending": "Just don't look directly into their eyes."
              },
              {
                  "hook": "Here's something you might not know about Minecraft.",
                  "body": "A Minecraft day and night cycle lasts about twenty minutes in real time.",
                  "ending": "So one Minecraft day is much faster than a real day."
              }
          ]

          fact = random.choice(facts)

          script = (
              fact["hook"] + " "
              + fact["body"] + " "
              + fact["ending"] + " "
              + "Follow for more Minecraft facts."
          )

          with open("output/script.txt", "w", encoding="utf-8") as f:
              f.write(script)

          # ---------------------------------------------------------
          # TITLE + DESCRIPTION
          # ---------------------------------------------------------

          title = fact["hook"].replace("Did you know ", "").strip()

          description = (
              "Minecraft fact: " + fact["body"] + "\n\n"
              "#Minecraft #MinecraftFacts #Gaming #Shorts"
          )

          with open("output/title.txt", "w", encoding="utf-8") as f:
              f.write(title[:95])

          with open("output/description.txt", "w", encoding="utf-8") as f:
              f.write(description)

          # ---------------------------------------------------------
          # VOICE
          # ---------------------------------------------------------

          subprocess.run([
              "espeak-ng",
              "-v", "en-us+m3",
              "-s", "155",
              "-p", "45",
              "-a", "170",
              "-w", "output/voice.wav",
              script
          ], check=True)

          # ---------------------------------------------------------
          # CAPTIONS
          # ---------------------------------------------------------

          words = script.split()

          # Rough timing based on number of words.
          total_words = len(words)
          seconds_per_word = DURATION / max(total_words, 1)

          def timestamp(seconds):
              hours = int(seconds // 3600)
              minutes = int((seconds % 3600) // 60)
              secs = int(seconds % 60)
              millis = int((seconds - int(seconds)) * 1000)
              return f"{hours:02d}:{minutes:02d}:{secs:02d},{millis:03d}"

          with open("output/captions.srt", "w", encoding="utf-8") as f:
              caption_number = 1

              for i in range(0, len(words), 6):
                  chunk = words[i:i+6]

                  start = i * seconds_per_word
                  end = min((i + len(chunk)) * seconds_per_word, DURATION)

                  f.write(f"{caption_number}\n")
                  f.write(f"{timestamp(start)} --> {timestamp(end)}\n")
                  f.write(" ".join(chunk) + "\n\n")

                  caption_number += 1

          # ---------------------------------------------------------
          # CINEMATIC MINECRAFT-STYLE VISUAL
          # ---------------------------------------------------------

          frames_dir = "frames"
          os.makedirs(frames_dir, exist_ok=True)

          font_paths = [
              "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf",
              "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          ]

          font_path = font_paths[0]

          big_font = ImageFont.truetype(font_path, 70)
          small_font = ImageFont.truetype(font_path, 42)

          total_frames = DURATION * FPS

          for frame in range(total_frames):
              t = frame / FPS

              img = Image.new("RGB", (WIDTH, HEIGHT), (20, 30, 40))
              draw = ImageDraw.Draw(img)

              # Sky gradient
              for y in range(HEIGHT):
                  ratio = y / HEIGHT

                  r = int(25 + 30 * ratio)
                  g = int(55 + 25 * ratio)
                  b = int(90 + 10 * ratio)

                  draw.line(
                      [(0, y), (WIDTH, y)],
                      fill=(r, g, b)
                  )

              # Sun
              sun_x = int(WIDTH * 0.75)
              sun_y = int(HEIGHT * 0.22)

              draw.ellipse(
                  [
                      sun_x - 100,
                      sun_y - 100,
                      sun_x + 100,
                      sun_y + 100
                  ],
                  fill=(255, 220, 120)
              )

              # Ground
              ground_y = int(HEIGHT * 0.68)

              draw.rectangle(
                  [0, ground_y, WIDTH, HEIGHT],
                  fill=(55, 105, 55)
              )

              # Minecraft-like grass blocks
              block_size = 120

              for x in range(-block_size, WIDTH + block_size, block_size):
                  for y in range(ground_y, HEIGHT, block_size):
                      offset = int(math.sin(t * 0.8 + x * 0.01) * 4)

                      draw.rectangle(
                          [
                              x,
                              y + offset,
                              x + block_size - 4,
                              y + block_size - 4 + offset
                          ],
                          fill=(75, 125, 65)
                      )

                      draw.rectangle(
                          [
                              x,
                              y + offset,
                              x + block_size - 4,
                              y + 15 + offset
                          ],
                          fill=(100, 160, 75)
                      )

              # Large cinematic blocky mountain
              mountain_points = [
                  (0, ground_y),
                  (170, 900),
                  (330, 1080),
                  (500, 760),
                  (670, 1030),
                  (830, 820),
                  (1080, 980),
                  (1080, ground_y)
              ]

              draw.polygon(
                  mountain_points,
                  fill=(45, 60, 70)
              )

              # Trees
              for tree_x in [130, 870]:
                  trunk_top = ground_y - 300

                  draw.rectangle(
                      [
                          tree_x - 25,
                          trunk_top,
                          tree_x + 25,
                          ground_y
                      ],
                      fill=(90, 55, 30)
                  )

                  draw.rectangle(
                      [
                          tree_x - 110,
                          trunk_top - 100,
                          tree_x + 110,
                          trunk_top + 100
                      ],
                      fill=(30, 90, 45)
                  )

              # Moving cinematic camera effect
              camera_x = int(math.sin(t * 0.6) * 25)

              overlay = Image.new("RGBA", (WIDTH, HEIGHT), (0, 0, 0, 0))
              odraw = ImageDraw.Draw(overlay)

              # Dark cinematic bars
              odraw.rectangle(
                  [0, 0, WIDTH, 150],
                  fill=(0, 0, 0, 170)
              )

              odraw.rectangle(
                  [0, HEIGHT - 150, WIDTH, HEIGHT],
                  fill=(0, 0, 0, 170)
              )

              # Hook text
              hook_words = fact["hook"].split()

              lines = []
              current = ""

              for word in hook_words:
                  test = (current + " " + word).strip()

                  if draw.textbbox((0, 0), test, font=big_font)[2] < 900:
                      current = test
                  else:
                      lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              text_y = 250

              for line in lines[:4]:
                  bbox = draw.textbbox((0, 0), line, font=big_font)
                  text_width = bbox[2] - bbox[0]
                  x = (WIDTH - text_width) // 2

                  draw.text(
                      (x + 4, text_y + 4),
                      line,
                      font=big_font,
                      fill=(0, 0, 0)
                  )

                  draw.text(
                      (x, text_y),
                      line,
                      font=big_font,
                      fill=(255, 255, 255)
                  )

                  text_y += 85

              img = Image.alpha_composite(
                  img.convert("RGBA"),
                  overlay
              ).convert("RGB")

              img.save(
                  f"{frames_dir}/frame_{frame:05d}.jpg",
                  quality=88
              )

          # ---------------------------------------------------------
          # CINEMATIC MUSIC
          # ---------------------------------------------------------

          sample_rate = 44100
          duration = DURATION

          t = np.linspace(
              0,
              duration,
              int(sample_rate * duration),
              endpoint=False
          )

          music = (
              0.07 * np.sin(2 * np.pi * 110 * t) +
              0.04 * np.sin(2 * np.pi * 220 * t) +
              0.025 * np.sin(2 * np.pi * 330 * t)
          )

          # Gentle pulse
          pulse = 0.5 + 0.5 * np.sin(2 * np.pi * 1.2 * t)
          music *= (0.7 + 0.3 * pulse)

          music = np.clip(music, -1, 1)

          audio = np.int16(music * 32767)

          with wave.open("output/music.wav", "w") as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sample_rate)
              wf.writeframes(audio.tobytes())

          # ---------------------------------------------------------
          # BUILD VIDEO
          # ---------------------------------------------------------

          subprocess.run([
              "ffmpeg",
              "-y",
              "-framerate", str(FPS),
              "-i", "frames/frame_%05d.jpg",
              "-i", "output/voice.wav",
              "-i", "output/music.wav",
              "-filter_complex",
              "[2:a]volume=0.25[music];"
              "[1:a]volume=1.0[voice];"
              "[voice][music]amix=inputs=2:duration=first[audio]",
              "-map", "0:v",
              "-map", "[audio]",
              "-vf",
              "subtitles=output/captions.srt:"
              "force_style='FontName=DejaVu Sans,"
              "FontSize=18,"
              "PrimaryColour=&H00FFFFFF,"
              "OutlineColour=&H00000000,"
              "BorderStyle=1,"
              "Outline=3,"
              "Shadow=1,"
              "Alignment=2,"
              "MarginV=220'",
              "-c:v", "libx264",
              "-preset", "veryfast",
              "-crf", "25",
              "-pix_fmt", "yuv420p",
              "-c:a", "aac",
              "-b:a", "128k",
              "-movflags", "+faststart",
              "-t", str(DURATION),
              "output/block-fuel-short.mp4"
          ], check=True)

          print("========================================")
          print("🔥 BLOCK FUEL VIDEO CREATED")
          print("========================================")
          print("Title:", title)
          print("File: output/block-fuel-short.mp4")
          print("========================================")
          PY

          python create_video.py

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: Block-Fuel-Short
          path: output/
          retention-days: 7
