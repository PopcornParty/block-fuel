                      ],
                      fill=(255, 35, 35)
                  )

                  draw.rectangle(
                      [
                          cx + offset + 15,
                          cy - 25,
                          cx + offset + 45,
                          cy + 5
                      ],
                      fill=(255, 35, 35)
                  )

              # Body
              draw.rectangle(
                  [
                      cx - 220,
                      cy + 80,
                      cx + 220,
                      cy + 230
                  ],
                  fill=(23, 23, 26)
              )

              # Energy
              particles(
                  draw,
