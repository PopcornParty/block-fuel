          # ============================================================
          # HOOKS
          # ============================================================

          HOOKS = [
              "Minecraft has a detail most players completely miss.",
              "This Minecraft fact sounds fake, but it isn't.",
              "You probably never noticed this in Minecraft.",
              "Minecraft quietly does something pretty crazy here.",
              "Most players don't know this Minecraft mechanic.",
