              # Dragon movement
              cx = 540 + math.sin(t * 1.4) * 220
              cy = 720 + math.sin(t * 2.1) * 130

              wing = math.sin(t * 7) * 70

              # Tail
              points = []

              for i in range(9):
                  px = cx - 150 - i * 55
                  py = cy + i * 20 + math.sin(t * 2 + i) * 20
                  points.append((px, py))

              draw.line(
