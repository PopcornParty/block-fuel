                  "theme": "jungle_temple",
                  "title": "Jungle Temples Use Redstone",
                  "hook": "Minecraft temples hide actual mechanical puzzles.",
                  "fact": (
                      "Jungle Temples contain traps, dispensers, tripwires and levers that can be used "
