              },

              {
                  "topic": "Slimes",
                  "theme": "slime",
                  "title": "Slimes Don't Just Get Killed",
                  "hook": "Minecraft slimes have a surprisingly unusual mechanic.",
                  "fact": (
                      "Large slimes split into smaller slimes when defeated, and those smaller "
                      "slimes can split again. This makes slimes unusual compared with most mobs. "
                      "Slime chunks also allow players to build dedicated slime farms underground "
