                  ),
              },

              {
                  "topic": "Glow Berries",
                  "theme": "glow_berries",
                  "title": "Glow Berries Light Up Caves",
                  "hook": "Minecraft lets players grow food that also works as a light source.",
                  "fact": (
                      "Glow Berries grow on cave vines and produce light when they are mature. "
                      "They can be eaten and can also be used to decorate underground builds. "
                      "Their combination of food, decoration and lighting makes them particularly useful "
                      "for natural-looking cave bases."
                  ),
              },

              {
                  "topic": "Moss",
                  "theme": "moss",
                  "title": "Moss Can Transform Stone",
                  "hook": "One green block can completely change the look of an area.",
                  "fact": (
                      "Moss blocks can spread through certain interactions and can be used with bone meal "
                      "to create vegetation. This makes moss useful for quickly transforming plain stone "
                      "areas into lush environments and for creating custom underground gardens."
                  ),
              },

              {
                  "topic": "Bamboo",
                  "theme": "bamboo",
                  "title": "Bamboo Can Become A Building Material",
                  "hook": "A plant that grows quickly can be turned into an entire wood set.",
                  "fact": (
                      "Bamboo can be grown and harvested quickly and can be crafted into bamboo planks "
