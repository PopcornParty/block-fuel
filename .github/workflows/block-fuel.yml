                  ),
              },

              {
                  "topic": "Horses",
                  "theme": "horse",
                  "title": "Horses Have Different Stats",
                  "hook": "Not every Minecraft horse is equally fast.",
                  "fact": (
                      "Horses can have different movement speeds, jump strengths and health values. "
