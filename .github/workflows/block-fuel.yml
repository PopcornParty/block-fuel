                  "theme": "skeleton",
                  "title": "Skeletons Are Ranged Enemies",
                  "hook": "Minecraft skeletons don't need to get close to hurt you.",
                  "fact": (
                      "Skeletons use bows and attack players from a distance. Their ranged behaviour means "
