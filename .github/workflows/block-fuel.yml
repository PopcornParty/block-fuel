                  fill=(70, 12, 78),
                  width=95
              )

              # Head
              hx = cx + 270
              hy = cy - 160

              draw.polygon(
                  [
                      (hx - 90, hy - 50),
                      (hx + 80, hy - 10),
                      (hx + 30, hy + 80),
                      (hx - 100, hy + 55)
