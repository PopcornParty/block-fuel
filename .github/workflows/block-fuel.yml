          # ------------------------------------------------------------
          # Build narration
          # ------------------------------------------------------------

          def build_narration(fact):
              hook = fact["hook"]

              paragraphs = [
                  s.strip()
                  for s in fact["fact"].split(".")
                  if s.strip()
              ]

              # Convert the detailed fact into natural spoken sentences.
              sentences = [
                  hook
              ]

              for paragraph in paragraphs:
                  sentences.append(
                      paragraph + "."
                  )

              sentences.append(
                  "And that's what makes Minecraft so interesting."
              )

              return sentences


          def generate_audio_sections(sentences):
              audio_files = []
              durations = []

              for i, sentence in enumerate(sentences):
                  path = TEMP / f"voice_{i:02d}.wav"

                  duration = make_voice(
                      sentence,
                      path
                  )

                  audio_files.append(path)
                  durations.append(duration)

              return audio_files, durations


          def combine_audio(files, output):
              concat_file = TEMP / "audio_concat.txt"

              with concat_file.open("w", encoding="utf-8") as f:
                  for path in files:
                      f.write(
                          f"file '{path.resolve()}'\n"
                      )

              run([
                  "ffmpeg",
                  "-y",
                  "-f",
                  "concat",
                  "-safe",
                  "0",
                  "-i",
                  str(concat_file),
                  "-c:a",
                  "pcm_s16le",
                  str(output)
              ])


          # ------------------------------------------------------------
          # Final composition
          # ------------------------------------------------------------

          def compose_video(
              video,
              voice,
              music,
              subtitles,
              output,
              total_duration
          ):
              # Slight music ducking.
              filter_complex = (
                  "[1:a]volume=1.0[voice];"
                  "[2:a]volume=0.16[music];"
                  "[voice][music]"
                  "amix=inputs=2:"
                  "duration=first:"
                  "dropout_transition=2"
                  "[mixed]"
              )

              run([
                  "ffmpeg",
                  "-y",
                  "-i",
                  str(video),
                  "-i",
                  str(voice),
                  "-i",
                  str(music),
                  "-filter_complex",
                  filter_complex,
                  "-map",
                  "0:v",
                  "-map",
                  "[mixed]",
                  "-vf",
                  f"subtitles={subtitles}:fontsdir=/usr/share/fonts/truetype/dejavu",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "medium",
                  "-crf",
                  "20",
                  "-pix_fmt",
                  "yuv420p",
                  "-c:a",
                  "aac",
                  "-b:a",
                  "192k",
                  "-t",
                  f"{total_duration:.3f}",
                  "-movflags",
                  "+faststart",
                  str(output)
              ])


          # ------------------------------------------------------------
          # Validation
          # ------------------------------------------------------------

          def validate_video(path):
              if not path.exists():
                  raise RuntimeError(
                      "Final MP4 was not created."
                  )

              size = path.stat().st_size

              if size < 100_000:
                  raise RuntimeError(
                      f"Final MP4 is suspiciously small: {size} bytes"
                  )

              duration = get_audio_duration(path)

              if duration < 15:
                  raise RuntimeError(
                      f"Final video is too short: {duration:.2f}s"
                  )

              # Check video stream.
              info = run_capture([
                  "ffprobe",
                  "-v",
                  "error",
                  "-select_streams",
                  "v:0",
                  "-show_entries",
                  "stream=width,height,codec_name",
                  "-of",
                  "csv=p=0",
                  str(path)
              ])

              print("VIDEO STREAM:", info)

              if "540,960" not in info:
                  print(
                      "Warning: video dimensions are not exactly "
                      "540x960, but the file is still usable."
                  )

              print(
                  f"Final video duration: {duration:.2f}s"
              )


          # ------------------------------------------------------------
          # Main
          # ------------------------------------------------------------

          def main():
              print("=" * 60)
              print("BLOCK FUEL GENERATOR")
              print("=" * 60)

              # Pick a fact.
              fact = random.choice(FACTS)

              print()
              print("TOPIC:", fact["topic"])
              print("TITLE:", fact["title"])
              print()

              sentences = build_narration(fact)

              print("NARRATION:")
              for sentence in sentences:
                  print("-", sentence)

              # Generate voice one sentence at a time.
              audio_files, audio_durations = generate_audio_sections(
                  sentences
              )

              print()
              print("AUDIO DURATIONS:")
              for i, duration in enumerate(audio_durations):
                  print(i, f"{duration:.2f}s")

              narration_duration = sum(audio_durations)

              # We want enough visual time for the narration.
              #
              # The scene durations are scaled so all visuals cover
              # the complete narration without looping.
              base_scene_count = 4

              scene_duration = max(
                  4.0,
                  narration_duration / base_scene_count
              )

              scene_durations = [
                  scene_duration
                  for _ in range(base_scene_count)
              ]

              total_duration = sum(scene_durations)

              print(
                  f"Visual duration: {total_duration:.2f}s"
              )

              # Generate video.
              raw_video = TEMP / "raw_video.mp4"

              render_video(
                  fact["theme"],
                  scene_durations,
                  raw_video
              )

              # Combine narration.
              voice_full = TEMP / "voice_full.wav"

              combine_audio(
                  audio_files,
                  voice_full
              )

              # Music.
              music = TEMP / "music.wav"

              make_music(
                  total_duration,
                  music
              )

              # Subtitles based on actual measured audio durations.
              subtitles = TEMP / "captions.ass"

              subtitle_sections = list(
                  zip(
                      sentences,
                      audio_durations
                  )
              )

              create_ass(
                  subtitle_sections,
                  subtitles
              )

              # Final MP4.
              final = OUT / "block_fuel_short.mp4"

              compose_video(
                  raw_video,
                  voice_full,
                  music,
                  subtitles,
                  final,
                  total_duration
              )

              validate_video(final)

              # Title.
              title = (
                  fact["title"]
                  + " | Minecraft Facts #shorts"
              )

              (OUT / "title.txt").write_text(
                  title,
                  encoding="utf-8"
              )

              # Description.
              description = (
                  fact["fact"]
                  + "\n\n"
                  + "Follow for more Minecraft facts!"
                  + "\n\n"
                  + "#Minecraft #MinecraftFacts #Shorts"
              )

              (OUT / "description.txt").write_text(
                  description,
                  encoding="utf-8"
              )

              # Fact metadata.
              metadata = (
                  "{\n"
                  f'  "topic": "{fact["topic"]}",\n'
                  f'  "title": "{fact["title"]}",\n'
                  f'  "theme": "{fact["theme"]}",\n'
                  f'  "duration": {total_duration:.2f}\n'
                  "}\n"
              )

              (OUT / "fact.json").write_text(
                  metadata,
                  encoding="utf-8"
              )

              print()
              print("=" * 60)
              print("BLOCK FUEL COMPLETE")
              print("=" * 60)
              print("Video:", final)
              print("Title:", title)
              print("Duration:", f"{total_duration:.2f}s")


          if __name__ == "__main__":
              main()

          PY

      - name: Generate Short
        run: |
          python generator/main.py

      - name: List output
        run: |
          echo "Generated files:"
          ls -lh output/

      - name: Upload finished Short
        uses: actions/upload-artifact@v4
        with:
          name: block-fuel-short-${{ github.run_number }}
          path: output/
          retention-days: 7
          if-no-files-found: error
