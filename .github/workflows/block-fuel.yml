                  ),
              },

              {
                  "topic": "Enchanting",
                  "theme": "enchanting",
                  "title": "Minecraft Enchanting",
                  "hook": "The enchanting table is doing more than just adding random effects.",
                  "fact": (
                      "Minecraft's enchanting system uses experience levels and nearby bookshelves "
