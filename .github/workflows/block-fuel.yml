          # ============================================================
          # MUSIC
          # ============================================================

          def make_music():
              path = OUTPUT/"music.wav"

              rate = 44100
              total = int(rate*DURATION)

              audio = np.zeros(
                  total,
                  dtype=np.float32
              )

              scales = [
                  [55, 65.41, 73.42, 82.41],
                  [65.41, 73.42, 87.31, 98],
                  [73.42, 82.41, 98, 110]
              ]

              notes = rng.choice(scales)

              for i in range(12):
                  freq = notes[i % len(notes)]

                  start = int(
                      i*total/12
                  )

                  end = min(
                      total,
                      start+int(rate*1.8)
                  )

                  n = end-start

                  if n <= 0:
                      continue

                  tt = np.arange(n)/rate

                  wave_a = np.sin(
                      2*np.pi*freq*tt
                  )

                  wave_b = 0.35*np.sin(
                      2*np.pi*freq*2*tt
                  )

                  wave_c = 0.15*np.sin(
                      2*np.pi*freq*3*tt
                  )

                  envelope = np.minimum(
                      1,
                      tt*5
                  ) * np.exp(
                      -tt*0.7
                  )

                  audio[start:end] += (
                      wave_a+
                      wave_b+
                      wave_c
                  )*envelope*0.045

              # cinematic low pulse
              tt = np.arange(total)/rate

              audio += (
                  np.sin(
                      2*np.pi*1.25*tt
                  )*0.012
              )

              # subtle high atmosphere
              audio += (
                  np.sin(
                      2*np.pi*330*tt
                  )*0.002
              )

              audio = np.clip(
                  audio,
                  -0.8,
                  0.8
              )

              pcm = (
                  audio*32767
              ).astype(np.int16)

              with wave.open(
                  str(path),
                  "wb"
              ) as wf:
                  wf.setnchannels(1)
                  wf.setsampwidth(2)
                  wf.setframerate(rate)
                  wf.writeframes(
                      pcm.tobytes()
                  )

              return path

          # ============================================================
          # CREATE VIDEO
          # ============================================================

          def make_video(topic, fact, environment_a):
              frames = OUTPUT/"frames"

              if frames.exists():
                  shutil.rmtree(frames)

              frames.mkdir()

              all_styles = list(BIOMES.keys())

              environment_b = rng.choice(
                  [
                      s for s in all_styles
                      if s != environment_a
                  ]
              )

              environment_c = rng.choice(
                  [
                      s for s in all_styles
                      if s not in [
                          environment_a,
                          environment_b
                      ]
                  ]
              )

              # Six distinct shots.
              shots = [
                  (0, 3, environment_a),
                  (3, 6, environment_a),
                  (6, 9, environment_b),
                  (9, 12, environment_b),
                  (12, 15, environment_c),
                  (15, 18, environment_c)
              ]

              for frame in range(TOTAL_FRAMES):
                  seconds = frame/FPS

                  active_style = environment_c
                  shot = 5

                  for index, (
                      start,
                      end,
                      style
                  ) in enumerate(shots):

                      if start <= seconds < end:
                          active_style = style
                          shot = index
                          break

                  img = environment(
                      active_style,
                      frame
                  )

                  render_subject(
                      img,
                      topic,
                      active_style,
                      frame,
                      shot
                  )

                  particles(
                      img,
                      frame,
                      active_style
                  )

                  # Camera movement.
                  progress = (
                      frame/TOTAL_FRAMES
                  )

                  camera_x = int(
                      math.sin(
                          progress*math.pi*2
                      )*22
                  )

                  camera_y = int(
                      math.cos(
                          progress*math.pi*3
                      )*12
                  )

                  if shot in [1, 3]:
                      camera_x += int(
                          math.sin(frame*0.35)*5
                      )

                  if shot == 4:
                      camera_x += int(
                          math.sin(frame*0.7)*12
                      )

                  if camera_x != 0 or camera_y != 0:
                      shifted = Image.new(
                          "RGB",
                          (
                              WIDTH,
                              HEIGHT
                          )
                      )

                      shifted.paste(
                          img,
                          (
                              camera_x,
                              camera_y
                          )
                      )

                      img = shifted

                  # Shot transition flash.
                  if frame % (FPS*3) < 4:
                      flash = Image.new(
                          "RGBA",
                          img.size,
                          (255,255,255,70)
                      )

                      img = Image.alpha_composite(
                          img.convert("RGBA"),
                          flash
                      ).convert("RGB")

                  # Captions.
                  if seconds < 3:
                      text = HOOK
                      y = 850

                  elif seconds < 15:
                      text = fact
                      y = 865

                  else:
                      text = ENDING
                      y = 900

                  img = caption(
                      img,
                      text,
                      y
                  )

                  # Shot number indicator.
                  d = ImageDraw.Draw(img)

                  d.rounded_rectangle(
                      (
                          25,
                          25,
                          135,
                          65
                      ),
                      radius=12,
                      fill=(0,0,0)
                  )

                  d.text(
                      (42, 32),
                      f"{shot+1}/6",
                      font=FONT_SMALL,
                      fill=(255,255,255)
                  )

                  # Progress bar.
                  progress = (
                      frame/
                      max(1, TOTAL_FRAMES-1)
                  )

                  d.rectangle(
                      (
                          0,
                          HEIGHT-7,
                          int(WIDTH*progress),
                          HEIGHT
                      ),
                      fill=(255,255,255)
                  )

                  img = cinematic(
                      img,
                      frame
                  )

                  filename = (
                      frames/
                      f"frame_{frame:05d}.png"
                  )

                  img.save(
                      filename
                  )

              raw = OUTPUT/"raw.mp4"

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-framerate",
                      str(FPS),
                      "-i",
                      str(
                          frames/
                          "frame_%05d.png"
                      ),
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "21",
                      "-pix_fmt",
                      "yuv420p",
                      "-movflags",
                      "+faststart",
                      str(raw)
                  ],
                  check=True
              )

              return (
                  raw,
                  environment_a,
                  environment_b,
                  environment_c
              )

          # ============================================================
          # FINAL AUDIO + VIDEO
          # ============================================================

          def combine(raw, voice, music):
              final = (
                  OUTPUT/
                  "block_fuel_short.mp4"
              )

              subprocess.run(
                  [
                      "ffmpeg",
                      "-y",
                      "-i",
                      str(raw),
                      "-i",
                      str(voice),
                      "-i",
                      str(music),
                      "-filter_complex",
                      "[1:a]volume=1.0[v];"
                      "[2:a]volume=0.16[m];"
                      "[v][m]amix="
                      "inputs=2:"
                      "duration=first:"
                      "dropout_transition=2[a]",
                      "-map",
                      "0:v",
                      "-map",
                      "[a]",
                      "-c:v",
                      "libx264",
                      "-preset",
                      "veryfast",
                      "-crf",
                      "20",
                      "-c:a",
                      "aac",
                      "-b:a",
                      "160k",
                      "-shortest",
                      "-movflags",
                      "+faststart",
                      str(final)
                  ],
                  check=True
              )

              return final

