name: Block Fuel

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy piper-tts

      - name: Create generator
        shell: bash
        run: |
          cat > generator.py <<'PY'
          import os
          import random
          import math
          import wave
          import subprocess
          import json
          from pathlib import Path

          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          import numpy as np


          # ============================================================
          # BLOCK FUEL
          # Detailed procedural Minecraft-style Shorts generator
          # ============================================================

          WIDTH = 1080
          HEIGHT = 1920
          FPS = 30

          ROOT = Path.cwd()
          TEMP = ROOT / "temp"
          OUTPUT = ROOT / "output"

          TEMP.mkdir(exist_ok=True)
          OUTPUT.mkdir(exist_ok=True)

          random.seed()

          VOICE = "en_US-ryan-high"


          # ============================================================
          # FACT BANK
          # ============================================================

          FACTS = [

              {
                  "topic": "Creepers",
                  "theme": "creeper",
                  "title": "Why Creepers Exist",
                  "hook": "Minecraft's most recognisable mob was actually created by accident.",
                  "fact": (
                      "When Minecraft creator Markus Persson was trying to make a pig, "
                      "the model's dimensions were accidentally entered incorrectly. "
                      "The result was a tall, strange creature that eventually became "
                      "the Creeper. Its famous green appearance and explosive behaviour "
                      "later turned it into one of Minecraft's most recognisable enemies."
                  ),
              },

              {
                  "topic": "Redstone",
                  "theme": "redstone",
                  "title": "Redstone Is Basically Minecraft Electricity",
                  "hook": "Redstone can make Minecraft behave like a tiny computer.",
                  "fact": (
                      "Redstone dust can transmit power between different components, "
                      "allowing players to build doors, traps, farms, clocks, calculators "
                      "and even working computers. Repeaters can extend signals, comparators "
                      "can read certain block states, and pistons can physically move blocks."
                  ),
              },

              {
                  "topic": "Ender Dragon",
                  "theme": "dragon",
                  "title": "The Ender Dragon",
                  "hook": "The Ender Dragon isn't just a giant flying boss.",
                  "fact": (
                      "The Ender Dragon is the main boss of the End dimension. "
                      "End crystals placed on obsidian towers heal the dragon while it fights, "
                      "so destroying those crystals changes the battle dramatically. "
                      "After the dragon is defeated, the End Gateway becomes available and "
                      "can eventually lead players towards the outer End islands."
                  ),
              },

              {
                  "topic": "Pistons",
                  "theme": "piston",
                  "title": "Pistons Changed Minecraft Engineering",
                  "hook": "One block completely changed what Minecraft players could build.",
                  "fact": (
                      "Pistons can push blocks when powered by redstone, while sticky pistons "
                      "can also pull certain blocks back. This simple mechanic made compact "
                      "doors, hidden entrances, elevators, farms, flying machines and enormous "
                      "redstone mechanisms possible."
                  ),
              },

              {
                  "topic": "Villagers",
                  "theme": "village",
                  "title": "Villagers Have Their Own Jobs",
                  "hook": "Minecraft villagers aren't just random NPCs standing around.",
                  "fact": (
                      "Villagers can take different professions depending on nearby job-site "
                      "blocks. A lectern can create a librarian, a smithing table can create "
                      "a toolsmith, and a brewing stand can create a cleric. Their trades "
                      "can also change the way players obtain useful items and resources."
                  ),
              },

              {
                  "topic": "Ocean Monuments",
                  "theme": "ocean",
                  "title": "The Ocean Monument",
                  "hook": "There is an enormous underwater structure hiding guardians.",
                  "fact": (
                      "Ocean Monuments are rare underwater structures mainly made from prismarine. "
                      "They contain rooms filled with Guardians and Elder Guardians. "
                      "Elder Guardians can give players Mining Fatigue, making it much harder "
                      "to break blocks while exploring the monument."
                  ),
              },

              {
                  "topic": "Nether",
                  "theme": "nether",
                  "title": "The Nether Is Much Bigger Than It Looks",
                  "hook": "The Nether isn't simply a dangerous version of the Overworld.",
                  "fact": (
                      "The Nether is a separate dimension containing unique terrain, structures "
                      "and mobs. Nether coordinates can also be extremely useful for travelling "
                      "long distances in the Overworld because movement in the Nether corresponds "
                      "to a much greater distance outside it."
                  ),
              },

              {
                  "topic": "Ancient Cities",
                  "theme": "deep_dark",
                  "title": "Ancient Cities",
                  "hook": "Some of Minecraft's biggest structures are almost completely hidden underground.",
                  "fact": (
                      "Ancient Cities generate deep underground inside the Deep Dark biome. "
                      "They contain large amounts of reinforced deepslate and structures made "
                      "from sculk. The area is also home to the Warden, making careless movement "
                      "far more dangerous than simply fighting ordinary hostile mobs."
                  ),
              },

              {
                  "topic": "Elytra",
                  "theme": "elytra",
                  "title": "How Elytra Changed Exploration",
                  "hook": "One item completely changed how players travel through Minecraft.",
                  "fact": (
                      "Elytra allow players to glide through the air and can be combined with "
                      "firework rockets for powered flight. They are normally found in End Cities "
                      "inside End Ships, which means players must first reach the outer End islands "
