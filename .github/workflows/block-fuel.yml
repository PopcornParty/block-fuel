name: Block Fuel

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  block-fuel:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu
          pip install transformers torch

      - name: Generate Minecraft script
        run: |
          python - <<'PY'
          from transformers import pipeline

          generator = pipeline(
              "text-generation",
              model="distilgpt2"
          )

          prompt = """Minecraft fact for a short cinematic YouTube Short.
          Start with a strong hook.
          Give one interesting real Minecraft fact.
          Keep it exciting and suitable for a family-friendly audience.
          End with: Follow for more Minecraft facts.
          """

          result = generator(
              prompt,
              max_new_tokens=100,
              do_sample=True,
              temperature=0.9
          )

          text = result[0]["generated_text"]
          text = text.replace("\n", " ").strip()

          print("SCRIPT:")
          print(text)

          with open("script.txt", "w") as f:
              f.write(text)
          PY

      - name: Generate male voice
        run: |
          espeak-ng \
            -v en-us+m3 \
            -s 155 \
            -p 35 \
            -a 150 \
            -f script.txt \
            -w voice.wav

      - name: Create Minecraft cinematic background
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "color=c=#182b18:s=1080x1920:r=30" \
            -vf "
              drawbox=x=0:y=0:w=1080:h=1920:color=#182b18@1:t=fill,
              drawbox=x=80:y=500:w=920:h=850:color=#315c32@1:t=fill,
              drawbox=x=160:y=650:w=760:h=500:color=#4b7d3d@1:t=fill,
              drawbox=x=0:y=1350:w=1080:h=570:color=#243b1f@1:t=fill,
              drawbox=x=300:y=420:w=160:h=700:color=#6b4226@1:t=fill,
              drawbox=x=620:y=350:w=180:h=770:color=#6b4226@1:t=fill,
              drawbox=x=330:y=300:w=100:h=120:color=#246b32@1:t=fill,
              drawbox=x=700:y=250:w=110:h=130:color=#246b32@1:t=fill,
              drawbox=x=0:y=0:w=1080:h=1920:color=black@0.25:t=fill
            " \
            -t 25 \
            background.mp4

      - name: Create captions
        run: |
          python - <<'PY'
          text = open("script.txt").read().strip()
          words = text.split()

          lines = []

          for i in range(0, len(words), 7):
              lines.append(" ".join(words[i:i+7]))

          with open("captions.txt", "w") as f:
              for line in lines:
                  f.write(line + "\n")
          PY

      - name: Create cinematic music
        run: |
          ffmpeg -y \
            -f lavfi \
            -i "sine=frequency=110:duration=25" \
            -f lavfi \
            -i "sine=frequency=165:duration=25" \
            -f lavfi \
            -i "sine=frequency=220:duration=25" \
            -filter_complex "
              [0:a]volume=0.05[a];
              [1:a]volume=0.035[b];
              [2:a]volume=0.025[c];
              [a][b][c]amix=inputs=3:duration=longest,
              aecho=0.8:0.9:500:0.2
            " \
            music.wav

      - name: Build vertical Short
        run: |
          ffmpeg -y \
            -i background.mp4 \
            -i voice.wav \
            -i music.wav \
            -filter_complex "
              [0:v]
              drawtext=
              fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:
              text='BLOCK FUEL':
              fontsize=72:
              fontcolor=white:
              x=(w-text_w)/2:
              y=120:
              shadowcolor=black:
              shadowx=4:
              shadowy=4
              [v];

              [1:a]volume=1.0[voice];
              [2:a]volume=0.18[music];
              [voice][music]amix=inputs=2:duration=first[a]
            " \
            -map "[v]" \
            -map "[a]" \
            -shortest \
            -c:v libx264 \
            -preset veryfast \
            -crf 23 \
            -c:a aac \
            -b:a 128k \
            -pix_fmt yuv420p \
            -movflags +faststart \
            block-fuel-short.mp4

      - name: Save finished Short
        uses: actions/upload-artifact@v4
        with:
          name: block-fuel-short
          path: |
            block-fuel-short.mp4
            script.txt
