                  y = (
                      i*83 +
                      int(
                          math.sin(
                              frame*0.035+i
                          )*100
                      )
                  ) % HEIGHT

                  size = 1+(i%4)

                  if style == "nether":
                      colour = (255, 100, 30)
                  elif style == "ocean":
                      colour = (100, 230, 240)
                  elif style == "end":
                      colour = (210, 160, 255)
                  else:
                      colour = (255, 255, 255)

                  d.rectangle(
                      (
                          x-size,
                          y-size,
                          x+size,
                          y+size
                      ),
                      fill=colour
                  )

          # ============================================================
          # TEXT
          # ============================================================

          def wrap(draw, text, fnt, maximum):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  test = (
                      word
                      if not current
                      else current+" "+word
                  )

                  box = draw.textbbox(
                      (0, 0),
                      test,
                      font=fnt
                  )

                  if box[2] <= maximum:
                      current = test
                  else:
                      if current:
                          lines.append(current)

                      current = word

              if current:
                  lines.append(current)

              return lines

          def caption(img, text, y, small=False):
              overlay = Image.new(
                  "RGBA",
                  img.size,
                  (0, 0, 0, 0)
              )

              d = ImageDraw.Draw(overlay)

              fnt = (
                  FONT_SMALL
                  if small
                  else FONT_FACT
              )

              lines = wrap(
                  d,
                  text,
                  fnt,
                  WIDTH-80
              )

              line_h = 44 if not small else 32
              box_h = len(lines)*line_h+40

              d.rounded_rectangle(
                  (
                      28,
                      y,
                      WIDTH-28,
                      y+box_h
                  ),
                  radius=22,
                  fill=(0, 0, 0, 185)
              )

              cy = y+18

              for line in lines:
                  box = d.textbbox(
                      (0, 0),
                      line,
                      font=fnt
                  )

                  tw = box[2]-box[0]
                  x = (WIDTH-tw)//2

                  d.text(
                      (x+3, cy+3),
                      line,
                      font=fnt,
                      fill=(0, 0, 0, 255)
                  )

                  d.text(
                      (x, cy),
                      line,
                      font=fnt,
                      fill=(255, 255, 255, 255)
                  )

                  cy += line_h

              return Image.alpha_composite(
                  img.convert("RGBA"),
                  overlay
              ).convert("RGB")

