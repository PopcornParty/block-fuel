                  ),
              },

              {
                  "topic": "Parrots",
                  "theme": "parrot",
                  "title": "Parrots Can Copy Nearby Mobs",
                  "hook": "Minecraft parrots can imitate the sounds of other creatures.",
                  "fact": (
