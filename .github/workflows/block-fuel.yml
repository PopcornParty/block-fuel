          # ------------------------------------------------------------
          # Text wrapping
          # ------------------------------------------------------------

          def wrap_text(draw, text, fnt, max_width):
              words = text.split()
              lines = []
              current = ""

              for word in words:
                  test = word if not current else current + " " + word
                  box = draw.textbbox((0, 0), test, font=fnt)

                  if box[2] <= max_width:
                      current = test
                  else:
                      if current:
                          lines.append(current)
                      current = word

              if current:
                  lines.append(current)

              return lines

          # ------------------------------------------------------------
          # Pexels search
          # ------------------------------------------------------------

          def pexels_search(query):
              if not PEXELS_KEY:
                  return []

              url = "https://api.pexels.com/v1/videos/search"

              headers = {
                  "Authorization": PEXELS_KEY
              }

              params = {
                  "query": query,
                  "orientation": "portrait",
                  "size": "medium",
                  "per_page": 15
              }

              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      params=params,
                      timeout=30
                  )

                  if response.status_code != 200:
                      print("Pexels error:", response.status_code)
                      return []

                  data = response.json()

                  return data.get("videos", [])

              except Exception as e:
                  print("Pexels request failed:", e)
                  return []

          # ------------------------------------------------------------
          # Download a real web clip
          # ------------------------------------------------------------

          def download_clip(video, index):
              files = video.get("video_files", [])

              if not files:
                  return None

              # Prefer portrait, then HD-ish.
              portrait = [
                  f for f in files
                  if f.get("width", 0) < f.get("height", 0)
              ]

              candidates = portrait if portrait else files

              candidates.sort(
                  key=lambda x: (
                      abs((x.get("width", 0) or 1) - 720),
                      -x.get("height", 0)
                  )
              )

              selected = candidates[0]

              link = selected.get("link")

              if not link:
                  return None

              output = CLIPS / f"clip_{index}.mp4"

              try:
                  with requests.get(
                      link,
                      stream=True,
                      timeout=60
                  ) as response:

                      if response.status_code != 200:
                          return None

                      with open(output, "wb") as f:
                          for chunk in response.iter_content(1024 * 256):
                              if chunk:
                                  f.write(chunk)

                  if output.stat().st_size < 50000:
                      output.unlink(missing_ok=True)
                      return None

                  return output

              except Exception as e:
                  print("Clip download failed:", e)
                  output.unlink(missing_ok=True)
                  return None

          # ------------------------------------------------------------
          # Get multiple real clips
          # ------------------------------------------------------------

          def collect_clips():
              if not PEXELS_KEY:
                  print("WARNING: PEXELS_API_KEY is missing.")
                  return []

              videos = pexels_search(fact["search"])

              if not videos:
                  # Broader fallback search.
                  videos = pexels_search(
                      "cinematic nature landscape technology"
                  )

              random.shuffle(videos)

              downloaded = []

              for i, video in enumerate(videos[:10]):
                  clip = download_clip(video, i)

                  if clip:
                      downloaded.append(clip)

                  if len(downloaded) >= 4:
                      break

              return downloaded

          # ------------------------------------------------------------
          # Make procedural fallback clips
          #
          # This is only used if Pexels cannot return footage.
          # ------------------------------------------------------------

          def make_fallback_video(path):
              print("Creating animated fallback footage.")

              duration = 20

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-f",
                  "lavfi",
                  "-i",
                  "color=c=black:s=720x1280:r=30",
                  "-vf",
                  (
                      "zoompan="
                      "z='min(zoom+0.0008,1.25)':"
                      "x='iw/2-(iw/zoom/2)':"
                      "y='ih/2-(ih/zoom/2)':"
                      "d=1:"
                      "s=720x1280:"
                      "fps=30,"
                      "drawbox=x=0:y=0:w=iw:h=ih:color=0x101820@0.25:t=fill"
                  ),
                  "-t",
                  str(duration),
                  "-pix_fmt",
                  "yuv420p",
                  str(path)
              ]

              subprocess.run(cmd, check=True)

          # ------------------------------------------------------------
          # Turn one source clip into a vertical cinematic segment
          # ------------------------------------------------------------

          def process_segment(source, output, start, duration, style):
              # Dynamic crop + zoom.
              #
              # scale2ref is avoided here for compatibility.
              # We scale to fill the vertical canvas, then crop.
              #

              zoom = 1.0 + random.uniform(0.02, 0.10)

              if style == 0:
                  crop_x = "iw/2-(iw/zoom/2)"
                  crop_y = "ih/2-(ih/zoom/2)"
              elif style == 1:
                  crop_x = "iw/2-(iw/zoom/2)+20*sin(t*0.8)"
                  crop_y = "ih/2-(ih/zoom/2)"
              elif style == 2:
                  crop_x = "iw/2-(iw/zoom/2)-20*sin(t*0.7)"
                  crop_y = "ih/2-(ih/zoom/2)+20*cos(t*0.6)"
              else:
                  crop_x = "iw/2-(iw/zoom/2)"
                  crop_y = "ih/2-(ih/zoom/2)-20*sin(t*0.6)"

              vf = (
                  "scale=720:1280:force_original_aspect_ratio=increase,"
                  f"crop=720:1280:{crop_x}:{crop_y},"
                  f"zoompan=z='{zoom}+0.015*sin(PI*on/30)':"
                  "x='iw/2-(iw/zoom/2)':"
                  "y='ih/2-(ih/zoom/2)':"
                  "d=1:s=720x1280:fps=30,"
                  "eq=contrast=1.08:saturation=1.08:brightness=0.01,"
                  "vignette=PI/5,"
                  "format=yuv420p"
              )

              cmd = [
                  "ffmpeg",
                  "-y",
                  "-ss",
                  str(start),
                  "-i",
                  str(source),
                  "-t",
                  str(duration),
                  "-vf",
                  vf,
                  "-an",
                  "-r",
                  "30",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "20",
                  str(output)
              ]

              subprocess.run(
                  cmd,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=True
              )

          # ------------------------------------------------------------
          # Create transitions between clips
          # ------------------------------------------------------------

          def combine_segments(segments, output):
              if len(segments) == 1:
                  shutil.copyfile(segments[0], output)
                  return

              inputs = []

              for segment in segments:
                  inputs.extend([
                      "-i",
                      str(segment)
                  ])

              # xfade transitions.
              #
              # Each segment is 4.5 sec.
              # Transition starts after 4.0 sec.
              #

              filter_parts = []

              current = "[0:v]"

              for i in range(1, len(segments)):
                  next_label = f"[v{i}]"
                  offset = (i * 4.5) - (i * 0.5)

                  filter_parts.append(
                      f"{current}[{i}:v]"
                      f"xfade=transition=fade:"
                      f"duration=0.5:"
                      f"offset={offset}"
                      f"{next_label}"
                  )

                  current = next_label

              filter_complex = ";".join(filter_parts)

              cmd = [
                  "ffmpeg",
                  "-y",
                  *inputs,
                  "-filter_complex",
                  filter_complex,
                  "-map",
                  current,
                  "-t",
                  "18",
                  "-an",
                  "-c:v",
                  "libx264",
                  "-preset",
                  "veryfast",
                  "-crf",
                  "20",
                  "-pix_fmt",
                  "yuv420p",
                  str(output)
              ]

              subprocess.run(cmd, check=True)

