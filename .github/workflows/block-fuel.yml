              )

              cx = 540
              cy = 850 + math.sin(t * 1.7) * 100

              # Heads
              for offset in [-160, 0, 160]:
                  draw.rectangle(
                      [
                          cx + offset - 75,
                          cy - 80,
                          cx + offset + 75,
