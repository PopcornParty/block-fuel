name: Block Fuel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install requests piper-tts

      - name: Download Piper voice
        run: |
          mkdir -p voice
          python -m piper.download_voices \
            --data-dir voice \
            en_GB-alan-medium

      - name: Create generator
        run: |
          mkdir -p generator

