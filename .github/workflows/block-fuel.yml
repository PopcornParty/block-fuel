          # ------------------------------------------------------------
          # Generate cinematic music
          # ------------------------------------------------------------

          def make_music():
              music = OUT / "music.wav"

              # Layered synth pad + pulse + bass.
              #
              # Everything is generated locally, so no copyrighted
              # music is downloaded.
