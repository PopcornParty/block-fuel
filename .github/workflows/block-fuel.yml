          # UTILITIES
          # ============================================================

          def run(cmd):
              print("$", " ".join(str(x) for x in cmd))
              subprocess.run(cmd, check=True)


          def clamp(v, a=0, b=255):
              return max(a, min(b, int(v)))


          def lerp(a, b, t):
              return a + (b - a) * t


          def pixel_rect(draw, x1, y1, x2, y2, fill, outline=None, width=1):
              draw.rectangle(
                  [
                      int(x1),
                      int(y1),
                      int(x2),
                      int(y2)
                  ],
                  fill=fill,
                  outline=outline,
                  width=width
              )


          def draw_pixel_grid(draw, cell=48, alpha=False):
              for x in range(0, WIDTH + cell, cell):
                  draw.line(
                      [(x, 0), (x, HEIGHT)],
                      fill=(255, 255, 255, 18) if alpha else (35, 35, 35),
                      width=1
                  )

              for y in range(0, HEIGHT + cell, cell):
                  draw.line(
                      [(0, y), (WIDTH, y)],
                      fill=(255, 255, 255, 18) if alpha else (35, 35, 35),
                      width=1
                  )


          def add_pixel_noise(img, rng, amount=0.045):
              arr = np.array(img).astype(np.int16)

              noise = rng.normal(
                  0,
                  amount * 255,
                  (HEIGHT, WIDTH, 1)
              )

              arr = np.clip(
                  arr + noise,
                  0,
                  255
              ).astype(np.uint8)

              return Image.fromarray(arr, "RGB")


          def add_vignette(img):
              arr = np.array(img).astype(np.float32)

              yy, xx = np.mgrid[0:HEIGHT, 0:WIDTH]

              dx = (xx - WIDTH / 2) / (WIDTH / 2)
              dy = (yy - HEIGHT / 2) / (HEIGHT / 2)

              dist = np.sqrt(dx * dx + dy * dy)

              factor = 1 - np.clip((dist - 0.25) * 0.28, 0, 0.28)

              arr *= factor[:, :, None]

              return Image.fromarray(
                  np.clip(arr, 0, 255).astype(np.uint8)
              )


          def add_scanlines(img):
              overlay = Image.new("RGBA", img.size, (0, 0, 0, 0))
              d = ImageDraw.Draw(overlay)

              for y in range(0, HEIGHT, 6):
                  d.line(
                      [(0, y), (WIDTH, y)],
                      fill=(0, 0, 0, 16),
                      width=1
                  )

              return Image.alpha_composite(
                  img.convert("RGBA"),
                  overlay
              ).convert("RGB")


          def draw_block(draw, x, y, size, base, light=None, dark=None):
              x = int(x)
              y = int(y)
              size = int(size)

              if light is None:
                  light = tuple(clamp(c + 28) for c in base)

              if dark is None:
                  dark = tuple(clamp(c - 32) for c in base)

              # Main block
              pixel_rect(
                  draw,
                  x,
                  y,
                  x + size,
                  y + size,
                  base
              )

              # Top and left highlights
              pixel_rect(
                  draw,
                  x,
                  y,
                  x + size,
                  y + max(2, size * 0.10),
                  light
              )

              pixel_rect(
                  draw,
                  x,
                  y,
                  x + max(2, size * 0.10),
                  y + size,
                  light
              )

              # Bottom/right shadow
              pixel_rect(
                  draw,
                  x,
                  y + size * 0.90,
                  x + size,
                  y + size,
                  dark
              )

              pixel_rect(
                  draw,
                  x + size * 0.90,
                  y,
                  x + size,
                  y + size,
                  dark
              )


          def draw_text_center(draw, text, y, fnt, fill=(255, 255, 255)):
              box = draw.textbbox((0, 0), text, font=fnt)

              w = box[2] - box[0]

              draw.text(
                  ((WIDTH - w) / 2, y),
                  text,
                  font=fnt,
                  fill=fill,
                  stroke_width=3,
                  stroke_fill=(0, 0, 0)
              )


          def wrap_text(text, max_chars):
              words = text.split()

              lines = []
              current = ""

              for word in words:
                  test = (
                      word if not current
                      else current + " " + word
                  )

                  if len(test) <= max_chars:
                      current = test
                  else:
                      if current:
                          lines.append(current)

                      current = word

              if current:
                  lines.append(current)

              return lines


          # ============================================================
          # PIXEL SKY
          # ============================================================

          def draw_sky(draw, top, bottom):
              for y in range(HEIGHT):
                  t = y / HEIGHT

                  c = tuple(
                      int(lerp(top[i], bottom[i], t))
                      for i in range(3)
                  )

                  draw.line(
                      [(0, y), (WIDTH, y)],
                      fill=c
                  )


          def stars(draw, rng, count=90):
              for _ in range(count):
                  x = rng.randint(0, WIDTH)
                  y = rng.randint(0, int(HEIGHT * 0.58))

                  s = rng.choice([2, 2, 3, 4])

                  draw.rectangle(
                      [x, y, x + s, y + s],
                      fill=(230, 240, 255)
                  )


          # ============================================================
          # PARTICLES
          # ============================================================

          def particles(draw, rng, t, colour, count=55):
              for i in range(count):
                  seed = i * 17.31

                  x = (
                      rng.random() * WIDTH
                      + math.sin(t * 1.2 + seed) * 80
                  ) % WIDTH

                  y = (
                      rng.random() * HEIGHT
                      - t * 180
                      + seed * 3
                  ) % HEIGHT

                  s = rng.choice([2, 3, 4, 5])

                  draw.rectangle(
                      [
                          int(x),
                          int(y),
                          int(x + s),
                          int(y + s)
                      ],
                      fill=colour
                  )


          # ============================================================
          # PIXEL TERRAIN
          # ============================================================

          def terrain(draw, rng, base_y, colour=(70, 120, 65)):
              x = 0

              while x < WIDTH:
                  width = rng.randint(50, 110)

                  height = rng.randint(
                      20,
                      100
                  )

                  top = base_y - height

                  draw.rectangle(
                      [
                          x,
                          top,
                          x + width,
                          HEIGHT
                      ],
                      fill=colour
                  )

                  # Grass strip
                  draw.rectangle(
                      [
                          x,
                          top,
                          x + width,
                          top + 10
                      ],
                      fill=(
                          min(255, colour[0] + 25),
                          min(255, colour[1] + 45),
                          min(255, colour[2] + 15)
                      )
                  )

                  # Dirt pixels
                  for _ in range(7):
                      px = rng.randint(x, min(WIDTH - 1, x + width))
                      py = rng.randint(top + 12, HEIGHT - 1)

                      draw.rectangle(
                          [
                              px,
                              py,
                              px + 7,
                              py + 7
                          ],
                          fill=(
                              max(0, colour[0] - 20),
                              max(0, colour[1] - 25),
                              max(0, colour[2] - 15)
                          )
                      )

                  x += width


          # ============================================================
          # DETAILED CREEPER
          # ============================================================

          def scene_creeper(draw, t, rng):
              draw_sky(
                  draw,
                  (18, 32, 52),
                  (55, 100, 110)
              )

              stars(draw, rng, 65)

              terrain(
                  draw,
                  rng,
                  1510,
                  (58, 100, 53)
              )

              # Moon
              draw.ellipse(
                  [760, 180, 910, 330],
                  fill=(220, 225, 205)
              )

              # Creeper
              bob = math.sin(t * 2.5) * 18
              scale = 1 + math.sin(t * 1.4) * 0.025

              cx = 540
              top = 700 + bob

              body_w = int(330 * scale)
              body_h = int(600 * scale)

              x1 = cx - body_w // 2
              x2 = cx + body_w // 2

              draw.rectangle(
                  [x1, top, x2, top + body_h],
                  fill=(58, 180, 72)
              )

              # Pixel texture
              for row in range(8):
                  for col in range(5):
                      if rng.random() < 0.35:
                          px = x1 + col * (body_w // 5) + 8
                          py = top + row * (body_h // 8) + 8

                          draw.rectangle(
                              [
                                  px,
                                  py,
                                  px + 24,
                                  py + 24
                              ],
                              fill=rng.choice([
                                  (40, 135, 55),
                                  (70, 195, 80),
                                  (48, 155, 60),
                                  (90, 205, 90)
                              ])
                          )

              # Face
              eye_y = top + 110

              draw.rectangle(
                  [x1 + 65, eye_y, x1 + 125, eye_y + 65],
                  fill=(10, 25, 15)
              )

              draw.rectangle(
                  [x2 - 125, eye_y, x2 - 65, eye_y + 65],
                  fill=(10, 25, 15)
              )

              mouth_y = top + 220

              draw.rectangle(
                  [cx - 50, mouth_y, cx + 50, mouth_y + 45],
                  fill=(8, 20, 12)
              )

              draw.rectangle(
                  [cx - 95, mouth_y + 40, cx - 50, mouth_y + 115],
                  fill=(8, 20, 12)
              )

              draw.rectangle(
                  [cx + 50, mouth_y + 40, cx + 95, mouth_y + 115],
                  fill=(8, 20, 12)
              )

              # Legs
              leg_w = 100
              leg_h = 320

              draw.rectangle(
                  [
                      cx - 130,
                      top + body_h - 50,
                      cx - 30,
                      top + body_h + leg_h
                  ],
                  fill=(48, 150, 60)
              )

              draw.rectangle(
                  [
                      cx + 30,
                      top + body_h - 50,
                      cx + 130,
                      top + body_h + leg_h
                  ],
                  fill=(48, 150, 60)
              )

              # Grass particles
              particles(
                  draw,
                  rng,
                  t,
                  (120, 205, 105),
                  35
              )


          # ============================================================
          # REDSTONE
          # ============================================================

          def scene_redstone(draw, t, rng):
              draw_sky(
                  draw,
                  (9, 12, 18),
                  (28, 32, 40)
              )

              # Large stone floor
              for y in range(1150, HEIGHT, 90):
                  for x in range(0, WIDTH, 90):
                      draw_block(
                          draw,
                          x,
                          y,
                          90,
                          rng.choice([
                              (75, 75, 78),
                              (82, 82, 85),
                              (68, 70, 73)
                          ])
                      )

              # Redstone circuit
              pulse = (
                  math.sin(t * 5) + 1
              ) / 2

              for i in range(8):
                  x = 120 + i * 120

                  powered = (
                      (t * 3 + i) % 8
                  ) < 4

                  colour = (
                      (255, 45, 45)
                      if powered
                      else (80, 25, 30)
                  )

                  draw.rectangle(
                      [
                          x,
                          1200,
                          x + 75,
                          1240
                      ],
                      fill=colour
                  )

                  draw.rectangle(
                      [
                          x + 25,
                          1170,
                          x + 50,
                          1270
                      ],
                      fill=(120, 120, 120)
                  )

              # Repeaters
              for i in range(5):
                  x = 180 + i * 180

                  draw_block(
                      draw,
                      x,
                      1080,
                      90,
                      (145, 145, 145)
                  )

                  draw.rectangle(
                      [
                          x + 20,
                          1110,
                          x + 70,
                          1125
                      ],
                      fill=(210, 35, 35)
                  )

              # Pistons
              for i in range(3):
                  x = 170 + i * 300

                  extension = (
                      math.sin(t * 3 + i) + 1
                  ) / 2

                  draw_block(
                      draw,
                      x,
                      900,
                      120,
                      (125, 125, 125)
                  )

                  draw.rectangle(
                      [
                          x + 120,
                          935,
                          x + 120 + int(extension * 100),
                          985
                      ],
                      fill=(170, 170, 170)
                  )

                  draw_block(
                      draw,
                      x + 120 + int(extension * 100),
                      920,
                      70,
                      (95, 170, 95)
                  )

              draw_text_center(
                  draw,
                  "REDSTONE",
