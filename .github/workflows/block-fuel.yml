name: Block Fuel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pillow numpy

      - name: Create Block Fuel generator
        shell: bash
        run: |
          mkdir -p generator output

          cat > generator/main.py <<'PY'
