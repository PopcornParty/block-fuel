                      fill=(170, 80, 255),
                      width=8
                  )

                  draw.rectangle(
                      [
                          x - 22,
                          1010,
                          x + 22,
                          1055
                      ],
                      fill=(190, 100, 255)
                  )

                  if pulse > 0.5:
                      draw.ellipse(
                          [
                              x - 65,
                              950,
                              x + 65,
                              1080
                          ],
                          outline=(220, 130, 255),
                          width=5
                      )


