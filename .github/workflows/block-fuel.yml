              draw.rectangle(
                  [500, 800, 580, 1400],
                  fill=(120, 230, 240)
              )

              draw.polygon(
                  [
                      (540, 800),
                      (540 - int(30 + pulse * 20), 300),
                      (540 + int(30 + pulse * 20), 300)
                  ],
                  fill=(100, 230, 255)
              )

              # Beam glow
              for w in [80, 55, 35, 20]:
                  draw.line(
                      [
                          (540 - w, 300),
                          (540 - w, 800)
                      ],
                      fill=(100, 220, 255),
                      width=3
                  )

                  draw.line(
                      [
                          (540 + w, 300),
                          (540 + w, 800)
                      ],
                      fill=(100, 220, 255),
                      width=3
                  )


          def scene_tnt(draw, t, rng):
              draw_sky(
